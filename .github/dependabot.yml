# Atualizações semanais de dependências, em poucos PRs para o dono aprovar pelo celular:
# minor e patch agrupados num PR por ecossistema; major chega em PR próprio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
