name: MCP release

# Estável `mcp-v<versão>` (ex: mcp-v0.3.0): gera o `mapping-mcp.js` e o anexa à Release. A versão
# da tag precisa ser a de `SERVER_VERSION` em `mcp/version.ts`. Só `x.y.z` dispara a estável: as
# pre-releases `mcp-v<versão>-rc.<n>` e `mcp-snapshot-pr<N>` (`mcp-prerelease.yml`) nunca a
# disparam. Ao publicar, apaga as rc (release e tag) da mesma versão.
#
# Três origens:
# - push na `main` (o merge de um épico ou do Dependabot; o ruleset só aceita esses): o job `decide`
#   confere se a tag da `SERVER_VERSION` existe. Existe: termina verde com um aviso e o `release` é
#   pulado. Não existe: o `release` cria a tag e a Release juntas (`gh release create --target`),
#   porque uma tag criada pelo GITHUB_TOKEN não dispara outro workflow (etapa #920).
# - push de uma tag `mcp-v*` criada à mão (plano B): publica essa tag, como antes. A Release pode
#   ter sido criada antes pela tela do GitHub (que cria a tag junto): os arquivos são anexados a ela.
# - `workflow_dispatch`: gera e anexa os arquivos de uma tag que já existe (ex.: uma Release que
#   ficou sem eles), sem apagar nem recriar nada.
# Nenhum dado de PR entra em `run:`: só `github.sha`, `github.ref_name` e as saídas do `decide`,
# passadas por `env:`.
on:
  push:
    branches: [main]
    tags: ['mcp-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: mcp-v0.3.2)'
        required: true

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.manual.outputs.tag || steps.main.outputs.tag }}
      sha: ${{ steps.main.outputs.sha }}
      publish: ${{ steps.manual.outputs.publish || steps.main.outputs.publish }}
    steps:
      # Tag manual ou `workflow_dispatch`: publica a tag do evento, como antes.
      - name: Tag do evento
        id: manual
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "tag=$TAG"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      # Push na main: a tag da versão do commit já existe?
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            mcp/version.ts
            scripts/release
      - name: Decidir se publica
        id: main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          node scripts/release/stableRelease.mjs decide \
            --version-file mcp/version.ts --sha "$SHA" --output "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Dois pushes seguidos na main com a mesma versão nova não publicam duas vezes: o segundo
    # espera, acha a tag e só anexa (`--clobber`).
    concurrency:
      group: mcp-release-${{ needs.decide.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - name: Conferir o nome da tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^mcp-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag inválida: $TAG (esperado mcp-v<versão>, ex.: mcp-v0.3.2)." >&2
            exit 1
          fi

      # Push na main: o commit do merge (o `sha` do `decide`); nos outros casos, a tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha || format('refs/tags/{0}', env.TAG) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Conferir a versão da tag
        run: |
          tag_version="${TAG#mcp-v}"
          code_version="$(sed -n "s/.*SERVER_VERSION = '\(.*\)';/\1/p" mcp/version.ts)"
          if [ "$tag_version" != "$code_version" ]; then
            echo "A tag $TAG não bate com SERVER_VERSION ($code_version) em mcp/version.ts." >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      # Sem os orçamentos de desempenho: oscilam conforme o runner e não dizem nada do MCP
      # (o CI e o deploy os medem à parte, com `npm run test:perf`).
      - run: PERF_BUDGETS=off npm test
      - run: npm run build:mcp

      - name: Testar o arquivo gerado fora do repositório
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "${TAG#mcp-v}" ]; then
            echo "--version imprimiu '$got', esperado '${TAG#mcp-v}' (sem sufixo)." >&2
            exit 1
          fi

      - name: Checksum
        working-directory: dist-mcp
        run: sha256sum mapping-mcp.js > mapping-mcp.js.sha256

      - name: Arquivos do workspace
        run: node scripts/release/workspaceAssets.mjs dist-mcp

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_MAIN: ${{ needs.decide.outputs.sha != '' }}
        run: |
          if [ "$FROM_MAIN" = true ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            # Outra execução criou a tag no meio do caminho: a Release sai nela, sem mover a tag.
            echo "::notice::A tag $TAG apareceu durante a execução; só anexa os arquivos."
          fi
          assets="$(node scripts/release/workspaceAssets.mjs dist-mcp)"
          mapfile -t assets <<< "$assets"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Criada pela tela do GitHub (ou numa execução anterior): só anexa os arquivos.
            gh release upload "$TAG" dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG"
          else
            gh release create "$TAG" \
              dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 "${assets[@]}" \
              --title "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --notes "Servidor MCP do Mapping. Copie \`mapping-mcp.js\` para \`tools/\` do seu repositório e registre-o no \`.mcp.json\`. Traz também o \`setup.sh\`, a skill \`SKILL.md\`, as regras \`AGENTS.mapping.md\` e o watcher \`watch-comments.mjs\` do workspace, cada um com o \`.sha256\`. Instruções em docs/MCP.md. Atualizar um workspace que ainda tem o \`setup.sh\` antigo, uma vez: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
          fi

      - name: Apagar as release candidates desta versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#mcp-v}"
          # Releases rc (com a tag) e tags rc que ficaram sem release.
          for rc in $(gh release list --limit 200 --json tagName --jq ".[].tagName" |
            grep -E '^mcp-v[0-9.]+-rc\.[0-9]+$' | grep -F "mcp-v${version}-rc." || true); do
            gh release delete "$rc" --cleanup-tag --yes
          done
          for rc in $(git ls-remote --tags origin "refs/tags/mcp-v${version}-rc.*" |
            sed -n "s#.*refs/tags/\(.*\)\$#\1#p"); do
            git push origin --delete "refs/tags/$rc" || true
          done
