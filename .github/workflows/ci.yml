name: CI

# Valida todo PR (e push em branches) antes do merge: os merges são feitos pelo
# celular, sem rodar nada localmente. A `main` é validada pelo deploy.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Testes unitários e de componentes, com relatório de cobertura (sem limite mínimo).
      - run: npm run test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Cobertura (src/)", "", "| Métrica | % | Cobertos |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      # Orçamentos de desempenho por quadro: sem cobertura (ela deixa o código mais lento).
      - run: npm run test:perf
      - run: npm run build

  # Ponta a ponta no `dist/index.html` final, em desktop e celular emulado (toque).
  # Só roda aqui: o ambiente de desenvolvimento pode não conseguir baixar o navegador.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
