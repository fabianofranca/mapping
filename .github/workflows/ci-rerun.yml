name: 'CI: rerun after an abandoned runner'

# When a PR's CI ends red because GitHub abandoned a runner (the job disappears from the
# run's job list; e.g. runs 42672468793 and 42672325637), it reruns the failed/missing
# jobs, once, with no session or owner in between (stage #1325). The rule "died from an
# abandoned runner" lives in `scripts/ci/ciRerun.mjs` (tested in `tests/tooling/ciRerun.test.ts`):
# a legitimate failure (test, lint, build) is not rerun, because the phase has to fix the code
# anyway. The timeout has two cases:
#   - On a timeout alone, the job ends `cancelled` and so does the CI run (not `failure`):
#     this workflow does not even run, skipped by the `if:` of the `rerun` job.
#   - In a run that is `failure` for another reason, the `cancelled` job counts as a legitimate failure in
#     `decide`, as the test "a cancelled job counts as a legitimate failure" in
#     `tests/tooling/ciRerun.test.ts` checks.
#
# The real demonstration was done in stage #1532, with PRs #1586 and #1587 (record in
# https://github.com/fabianofranca/mapping/issues/1532#issuecomment-6787509092). To simulate
# the abandonment on a throwaway branch, besides removing the `epic` job, you must make `check` fail
# only on attempt 1 and replace the vitest of `test`, `coverage` and `e2e` with `echo`, because the
# `tests/tooling` tests read the branch's `ci.yml`.
#
# Only attempt 1 (`run_attempt == 1`): one rerun per commit, never in a loop. Attempt 2
# never triggers another; if there is a second rerun, it belongs to the phase. Forks and Dependabot are
# left out (their `workflow_run` gets a read-only token and the rerun would fail for nothing).
#
# The expected jobs come from the `ci.yml` of `main` (sparse checkout, without PR code, which is not
# trusted). `workflow_run` always runs this file's version on the default branch: changes here
# only take effect after the merge into `main`. This workflow is not a required check: it never leaves a check
# pending.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: ci-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci
          sparse-checkout-cone-mode: false
      - name: Decide whether to rerun
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/jobs.json"
          node scripts/ci/ciRerun.mjs decide --ci .github/workflows/ci.yml --jobs "$RUNNER_TEMP/jobs.json" --output "$GITHUB_OUTPUT"
      - name: Rerun the abandoned jobs
        if: steps.decide.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.decide.outcome }}
          RERUN: ${{ steps.decide.outputs.rerun }}
          ABANDONED: ${{ steps.decide.outputs.abandoned }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "não reexecuta: a decisão falhou ($OUTCOME); veja o log do passo anterior" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RERUN" = "true" ]; then
            echo "reexecuta: abandonados $ABANDONED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "não reexecuta: $REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
