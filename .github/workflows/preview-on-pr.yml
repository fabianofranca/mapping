name: PR preview

# When a PR's CI ends green, publishes the validated commit at `/preview/`, with no
# manual `workflow_dispatch`. This workflow only triggers the Deploy
# (`gh workflow run deploy.yml --ref main -f branch=<PR branch> -f sha=<commit>`); what
# publishes is `deploy.yml`, which runs on `main` (the `github-pages` environment usually accepts
# deploys only from it). With the `sha`, the Deploy checks the `check` and `e2e` check runs
# of that commit and, if green, does not run the preview's ci.yml again (stage #375): each commit is
# validated once, by the PR's CI. A superseded commit (cancelled CI) generates no preview.
#
# `workflow_run` always runs this file's version on the default branch: changes here only
# take effect after the merge into `main`.
#
# The `GITHUB_TOKEN` can trigger `workflow_dispatch` (a documented GitHub exception).
# A fork PR is left out: its token has no write access.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: preview-on-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Deploy of the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

      - name: Links in the summary
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "Deploy triggered for branch \`$HEAD_BRANCH\` at commit \`$HEAD_SHA\`, validated by the CI: $CI_RUN"
            echo
            echo "- Preview: https://${OWNER}.github.io/${repo}/preview/"
            echo "- Deploy runs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml"
            echo
            echo "There is only one preview: the latest PR with a green CI gets \`/preview/\`."
          } >> "$GITHUB_STEP_SUMMARY"
