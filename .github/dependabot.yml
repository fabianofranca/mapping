# Weekly dependency updates, in few PRs for the owner to approve from the phone:
# minor and patch grouped in one PR per ecosystem; major comes in its own PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the minimum supported Node version (.nvmrc; the MCP promises
      # Node ≥ 20), not the newest: types of a higher Node let through APIs that do not
      # exist where the code runs. Patches and minors of the current line keep arriving.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Postponed migration, in a GitHub issue with the `roadmap` label: TypeScript 7
      # (typescript-eslint still requires TS < 6.1). It comes in as its own phase; remove the rule
      # when starting.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
