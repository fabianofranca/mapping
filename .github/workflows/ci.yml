name: CI

# Cópia descartável de teste (teste/ci-abandono): sem o job `epic`; `check` falha na tentativa 1.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        description: Ref a validar (vazio = o do evento)
        type: string
        required: false
        default: ''
      label:
        description: Sufixo dos artifacts (main, preview), únicos na execução que chama
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@v5
        with:
          path: .cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-
      - run: npm run lint:ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-deps
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          COVERAGE_REPORT: off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-${{ matrix.shard }}
          path: .vitest/blob
          if-no-files-found: ignore

  coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-*
          path: .vitest/blob
          merge-multiple: true
      - run: npx vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: coverage
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      INDEX_HTML_MAX_BYTES: 2031616
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-deps
      - run: npm run test:perf
      - run: npm run test:scale
      - run: npm run build
      - run: npm run build:mcp
      - run: npm run build:viewer --if-present
      - name: Tamanho do dist/index.html
        run: |
          size=$(stat -c %s dist/index.html)
          if [ "$size" -gt "$INDEX_HTML_MAX_BYTES" ]; then
            echo "::error file=dist/index.html::$size bytes, acima do orçamento de $INDEX_HTML_MAX_BYTES bytes."
            exit 1
          fi

  check:
    needs: [static, test, coverage, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Todos os jobs em sucesso
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Algum job do check não terminou em success: $RESULTS"
              exit 1
            fi
          done
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "::error::Teste: falha forçada na tentativa 1."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-deps
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Chromium abre?
        id: chromium
        run: |
          exe=$(node -p "require('@playwright/test').chromium.executablePath()")
          if [ -x "$exe" ] && ! ldd "$exe" | grep -q 'not found' && "$exe" --headless --no-sandbox --version; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chromium.outputs.ok != 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
