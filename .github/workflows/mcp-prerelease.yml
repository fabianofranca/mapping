name: MCP pre-release

# Canais de teste do servidor MCP, antes da estável (`mcp-release.yml`, tag `mcp-v<versão>`).
# A versão do código (`SERVER_VERSION` em `mcp/version.ts`) é uma por épico; estes canais só
# acrescentam um sufixo ao build (`MCP_BUILD_SUFFIX`, validado em `mcp/build.mjs`).
#
# - snapshot: todo PR com base num `epic/**` gera `mcp-snapshot-pr<N>` (pre-release fixa,
#   sobrescrita a cada push; versão `<versão>-snapshot.pr<N>+<sha curto>`). Quando o PR fecha
#   (mesclado ou não), a release e a tag são apagadas.
# - rc: só sai no merge de um PR com o rótulo `mcp-rc` num `epic/**`: o PR da última fase do
#   épico (o agente dessa fase põe o rótulo ao abrir o PR). Gera `mcp-v<versão>-rc.<n>`
#   (n = maior rc existente daquela versão + 1) a partir do commit do merge. Sem o rótulo, o
#   merge não gera rc. Se alguém esquecer o rótulo, rode este workflow à mão (`workflow_dispatch`)
#   no branch `epic/**`. As rc são apagadas pelo `mcp-release.yml` quando a estável da mesma
#   versão é publicada.
# Os testes do PR rodam no `ci.yml`; o snapshot não os repete. A rc os roda, como a estável.
#
# O código do PR (`npm ci`, build, testes) roda em jobs `*-build`, só com `contents: read` e sem
# credencial persistida no checkout; o arquivo gerado passa por artifact a um job `*-publish`,
# o único com `contents: write`, que não faz checkout nem roda código do PR (etapa #971,
# decisão 11). O nome das pre-releases e os arquivos publicados não mudam.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ['epic/**']
  workflow_dispatch:

permissions:
  contents: read

# Um grupo por PR: o fechamento (`cleanup`) cancela um snapshot em andamento, inclusive entre o
# `snapshot-build` e o `snapshot-publish`, e nenhuma pre-release `mcp-snapshot-pr<N>` fica órfã.
# O `workflow_dispatch` (só a rc) tem grupo próprio por execução; a rc serializa à parte.
concurrency:
  group: ${{ github.event.pull_request.number && format('mcp-snapshot-pr{0}', github.event.pull_request.number) || format('mcp-dispatch-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  snapshot-build:
    # PRs de fork não recebem token de escrita; só PRs do próprio repositório.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Calcular a versão do snapshot
        run: |
          code_version="$(node scripts/release/stableRelease.mjs version --version-file mcp/version.ts)"
          suffix="-snapshot.pr${PR}+${HEAD_SHA:0:7}"
          echo "SERVER_VERSION=$code_version" >> "$GITHUB_ENV"
          echo "MCP_BUILD_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "EXPECTED=${code_version}${suffix}" >> "$GITHUB_ENV"

      - run: npm run build:mcp

      - name: Testar o arquivo gerado fora do repositório
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "$EXPECTED" ]; then
            echo "--version imprimiu '$got', esperado '$EXPECTED'." >&2
            exit 1
          fi
          # O extrator de assinaturas (`.mjs`, sem dependências) também roda fora do repositório.
          cp "$GITHUB_WORKSPACE/dist-mcp/mapping-signature.mjs" .
          node mapping-signature.mjs --help > /dev/null

      - name: Checksum
        working-directory: dist-mcp
        run: |
          sha256sum mapping-mcp.js > mapping-mcp.js.sha256
          sha256sum mapping-signature.mjs > mapping-signature.mjs.sha256

      # Os arquivos publicados ficam juntos em `release-assets/`: o servidor, o extrator de assinaturas, os `.sha256` e os do
      # workspace (o script dos arquivos do workspace roda uma vez).
      - name: Arquivos da Release
        run: |
          mkdir release-assets
          cp dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 release-assets/
          cp dist-mcp/mapping-signature.mjs dist-mcp/mapping-signature.mjs.sha256 release-assets/
          node scripts/release/workspaceAssets.mjs release-assets > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-snapshot-assets
          path: release-assets
          if-no-files-found: error

  snapshot-publish:
    needs: snapshot-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-snapshot-assets
          path: release-assets

      # O artifact vem de um job que roda código do PR: só publica se tiver exatamente os
      # arquivos esperados (cada um com o seu `.sha256`).
      - name: Conferir os arquivos baixados
        run: |
          expected="AGENTS.mapping.md AGENTS.mapping.md.sha256 SKILL.md SKILL.md.sha256 mapping-mcp.js mapping-mcp.js.sha256 mapping-signature.mjs mapping-signature.mjs.sha256 setup.sh setup.sh.sha256 watch-comments.mjs watch-comments.mjs.sha256"
          expected="$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')"
          found="$(ls -1 release-assets | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$found" != "$expected" ]; then
            echo "Arquivos inesperados em release-assets: $found (esperado: $expected)." >&2
            exit 1
          fi

      - name: Publicar no snapshot do PR
        run: |
          tag="mcp-snapshot-pr${PR}"
          title="$tag"
          assets=(release-assets/*)
          notes="Build provisório do PR #${PR}, para testar antes de entrar no épico. Commit ${HEAD_SHA:0:7}. Sobrescrito a cada push e apagado quando o PR fecha. Traz também o \`setup.sh\`, a skill \`SKILL.md\`, as regras \`AGENTS.mapping.md\` e o watcher \`watch-comments.mjs\` do workspace e o extrator de assinaturas \`mapping-signature.mjs\`, cada um com o \`.sha256\`. Instalação: \`./setup.sh ${tag}\` (examples/workspace/) ou baixe \`mapping-mcp.js\` e confira com o \`.sha256\`. Atualizar um workspace que ainda tem o \`setup.sh\` antigo, uma vez: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
          if gh release view "$tag" > /dev/null 2>&1; then
            # Já existe: move a tag para o commit novo e troca os arquivos.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$HEAD_SHA" -F force=true
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --prerelease --target "$HEAD_SHA" \
              --title "$title" --notes "$notes"
          fi

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Apagar o snapshot do PR
        run: |
          # Sem checkout: `--repo` basta. Não falha se o snapshot não existe.
          gh release delete "mcp-snapshot-pr${PR}" \
            --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "Sem snapshot para apagar."

  rc-build:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'mcp-rc') &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/epic/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Por épico (o nome do branch, igual no PR e no `workflow_dispatch`, sem `refs/heads/`) e
    # sem cancelar: uma rc na fila não pode perder o seu número. O `rc-publish` usa o mesmo
    # grupo.
    concurrency:
      group: mcp-rc-${{ github.event.pull_request.base.ref || github.ref_name }}
      cancel-in-progress: false
    outputs:
      rc_tag: ${{ steps.number.outputs.rc_tag }}
      version: ${{ steps.number.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      # Sem os orçamentos de desempenho: oscilam conforme o runner (o CI os mede à parte).
      - run: PERF_BUDGETS=off npm test

      - name: Calcular o número da rc
        id: number
        run: |
          version="$(node scripts/release/stableRelease.mjs version --version-file mcp/version.ts)"
          # Maior rc existente (tags no servidor) + 1. Pela API: o checkout não guarda credencial.
          last="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/mcp-v${version}-rc." --paginate --jq '.[].ref' |
            sed -n "s#^refs/tags/mcp-v${version}-rc\.\([0-9][0-9]*\)\$#\1#p" |
            sort -n | tail -1)"
          n=$(( ${last:-0} + 1 ))
          echo "SERVER_VERSION=$version" >> "$GITHUB_ENV"
          echo "MCP_BUILD_SUFFIX=-rc.${n}" >> "$GITHUB_ENV"
          echo "EXPECTED=${version}-rc.${n}" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rc_tag=mcp-v${version}-rc.${n}" >> "$GITHUB_OUTPUT"

      - run: npm run build:mcp

      - name: Testar o arquivo gerado fora do repositório
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "$EXPECTED" ]; then
            echo "--version imprimiu '$got', esperado '$EXPECTED'." >&2
            exit 1
          fi
          # O extrator de assinaturas (`.mjs`, sem dependências) também roda fora do repositório.
          cp "$GITHUB_WORKSPACE/dist-mcp/mapping-signature.mjs" .
          node mapping-signature.mjs --help > /dev/null

      - name: Checksum
        working-directory: dist-mcp
        run: |
          sha256sum mapping-mcp.js > mapping-mcp.js.sha256
          sha256sum mapping-signature.mjs > mapping-signature.mjs.sha256

      # Os arquivos publicados ficam juntos em `release-assets/` (o script dos arquivos do
      # workspace roda uma vez).
      - name: Arquivos da Release
        run: |
          mkdir release-assets
          cp dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 release-assets/
          cp dist-mcp/mapping-signature.mjs dist-mcp/mapping-signature.mjs.sha256 release-assets/
          node scripts/release/workspaceAssets.mjs release-assets > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-rc-assets
          path: release-assets
          if-no-files-found: error

  rc-publish:
    needs: rc-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mcp-rc-${{ github.event.pull_request.base.ref || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      EPIC: ${{ github.event.pull_request.base.ref || github.ref_name }}
      RC_TAG: ${{ needs.rc-build.outputs.rc_tag }}
      SERVER_VERSION: ${{ needs.rc-build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-rc-assets
          path: release-assets

      # O artifact vem de um job que roda código do PR: só publica se tiver exatamente os
      # arquivos esperados (cada um com o seu `.sha256`).
      - name: Conferir os arquivos baixados
        run: |
          expected="AGENTS.mapping.md AGENTS.mapping.md.sha256 SKILL.md SKILL.md.sha256 mapping-mcp.js mapping-mcp.js.sha256 mapping-signature.mjs mapping-signature.mjs.sha256 setup.sh setup.sh.sha256 watch-comments.mjs watch-comments.mjs.sha256"
          expected="$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')"
          found="$(ls -1 release-assets | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$found" != "$expected" ]; then
            echo "Arquivos inesperados em release-assets: $found (esperado: $expected)." >&2
            exit 1
          fi

      - name: Publicar a release candidate
        run: |
          # Os valores vêm do job que compilou o código do PR: confere o formato antes de usar.
          if ! printf '%s' "$RC_TAG" | grep -Eq '^mcp-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "Tag de rc inválida: $RC_TAG." >&2
            exit 1
          fi
          assets=(release-assets/*)
          gh release create "$RC_TAG" \
            "${assets[@]}" \
            --prerelease --target "$TARGET_SHA" \
            --title "$RC_TAG" \
            --notes "Release candidate do épico \`${EPIC}\`, commit ${TARGET_SHA:0:7}. Provisória: apagada quando a estável mcp-v${SERVER_VERSION} for publicada. Traz também o \`setup.sh\`, a skill \`SKILL.md\`, as regras \`AGENTS.mapping.md\` e o watcher \`watch-comments.mjs\` do workspace e o extrator de assinaturas \`mapping-signature.mjs\`, cada um com o \`.sha256\`. Instalação: \`./setup.sh ${RC_TAG}\` (examples/workspace/) ou baixe \`mapping-mcp.js\` e confira com o \`.sha256\`. Atualizar um workspace que ainda tem o \`setup.sh\` antigo, uma vez: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${RC_TAG}/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
