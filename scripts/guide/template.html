<!doctype html>
<html lang="en" data-locale="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapping guide</title>
    <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
    <script>
      // Follows the theme chosen in the app (same origin, same Settings key). The guide is the
      // same file in both channels; in the preview (/preview/guide/) the app saves with the
      // `preview:` prefix (channelStorageKey), so the channel comes from the path.
      try {
        const themeKey = /\/preview\/guide\//.test(location.pathname)
          ? 'preview:mapping.theme'
          : 'mapping.theme';
        const theme = localStorage.getItem(themeKey);
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch {
        // Storage blocked: the system theme applies.
      }
    </script>
    <script>
      /*__PICK_LOCALE__*/
      // The language: the one saved by the app (same key as the theme, with the channel prefix)
      // or the browser's, by the same rule as the app. There is no picker in the page.
      {
        let saved = null;
        try {
          saved = localStorage.getItem(
            /\/preview\/guide\//.test(location.pathname)
              ? 'preview:mapping.locale'
              : 'mapping.locale',
          );
        } catch {
          // Storage blocked: the browser language applies.
        }
        const chosen = pickLocale(saved, navigator.language);
        document.documentElement.setAttribute('data-locale', chosen);
        document.documentElement.setAttribute(
          'lang',
          chosen === 'pt-BR' ? 'pt-BR' : 'en',
        );
      }
    </script>
    <style>
      /*__TOKENS_CSS__*/

      /* Guide: walkthrough on the left, annotated container in the center, inspector on the right.
       Only the app's tokens (colors, spacing, radii, fonts, durations); the drawings of the
       Material 3 components stay in the JS (they represent the component, not the interface). */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font: var(--t-body);
        padding-block: var(--space-4);
        padding-inline: max(var(--space-4), env(safe-area-inset-left, 0px))
          max(var(--space-4), env(safe-area-inset-right, 0px));
      }
      a {
        color: var(--color-accent);
      }
      .wrap {
        max-width: 1360px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      header h1 {
        font: var(--t-display);
        margin: 0 0 var(--space-1-5);
        text-wrap: balance;
      }
      header p {
        margin: 0;
        color: var(--color-text-muted);
        max-width: 80ch;
      }
      .open {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-2) var(--space-4);
        margin-top: var(--space-3);
        color: var(--color-text-muted);
      }
      code {
        font: var(--t-code);
        background: var(--color-selection);
        padding: var(--space-px) var(--space-1-5);
        border-radius: var(--radius-sm);
      }
      kbd {
        font: var(--t-code);
        background: var(--color-surface);
        border: 1px solid var(--color-border-control);
        padding: var(--space-px) var(--space-1-5);
        border-radius: var(--radius-sm);
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(250px, 310px) minmax(0, 1fr) minmax(260px, 330px);
        gap: var(--space-4);
        align-items: start;
      }
      /* The @media breakpoints stay literal: CSS does not accept var() there. */
      @media (max-width: 1020px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        min-width: 0;
      }
      h2 {
        font: var(--t-title);
        margin: 0 0 var(--space-2);
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: var(--space-0-5);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .steps button {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: flex;
        gap: var(--space-2);
        width: 100%;
        padding: var(--space-1-5) var(--space-2);
        border-radius: var(--radius-md);
        color: var(--color-text-muted);
      }
      .steps button:hover {
        background: var(--color-hover);
      }
      .steps .n {
        font: var(--t-code);
        min-width: 2em;
      }
      .steps .on {
        background: var(--color-selection);
        color: var(--color-text);
        font-weight: 600;
      }
      .steps button:focus-visible,
      .tab:focus-visible,
      .persp select:focus-visible,
      .chip:focus-visible,
      .btn:focus-visible,
      .link:focus-visible,
      .crumbs button:focus-visible,
      .mk:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      .lesson {
        border-top: 1px solid var(--color-border);
        margin-top: var(--space-3);
        padding-top: var(--space-3);
      }
      .lesson h3 {
        font: var(--t-title);
        margin: 0 0 var(--space-1-5);
      }
      .lesson p {
        margin: 0 0 var(--space-2);
      }
      .lesson .try {
        background: var(--color-selection);
        border-radius: var(--radius-md);
        padding: var(--space-2) var(--space-3);
      }
      .nav {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }
      .btn {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        height: var(--control-height);
        display: inline-flex;
        align-items: center;
        padding: 0 var(--space-3);
        border: 1px solid var(--color-border-control);
        border-radius: var(--control-radius);
        font: var(--t-text);
      }
      .btn:hover {
        background: var(--color-hover);
      }
      .btn.primary {
        background: var(--color-accent);
        color: var(--color-accent-text);
        border-color: var(--color-accent);
      }
      .btn.primary:hover {
        background: var(--color-accent-hover);
      }
      .btn[disabled] {
        opacity: var(--opacity-disabled);
        cursor: default;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1-5);
        margin-bottom: var(--space-3);
      }
      .tab {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        padding: var(--space-1) var(--space-3);
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border-control);
      }
      .tab:hover {
        background: var(--color-hover);
      }
      .tab[aria-selected='true'] {
        background: var(--color-accent);
        color: var(--color-accent-text);
        border-color: var(--color-accent);
      }
      .persp {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-3);
      }
      .persp label {
        color: var(--color-text-muted);
      }
      .persp select {
        height: var(--control-height);
        padding: 0 var(--space-2);
        border: 1px solid var(--color-border-control);
        border-radius: var(--control-radius);
        background: var(--color-surface);
        color: var(--color-text);
        font: var(--t-text);
      }
      .stage {
        background: var(--color-canvas-bg);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        display: flex;
        justify-content: center;
        max-height: 74vh;
        overflow: auto;
      }
      .stage svg {
        display: block;
        max-width: 100%;
        height: auto;
        max-height: 70vh;
        width: auto;
      }
      svg text {
        font-family: var(--font-sans);
      }
      .layers {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1-5);
        margin-top: var(--space-3);
      }
      .chip {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: var(--space-1-5);
        padding: var(--space-0-5) var(--space-3) var(--space-0-5) var(--space-2);
        border: 1px solid var(--color-border-control);
        border-radius: var(--radius-full);
        font: var(--t-small);
      }
      .chip i {
        width: var(--space-2);
        height: var(--space-2);
        border-radius: var(--radius-full);
        display: inline-block;
      }
      .chip[aria-pressed='false'] {
        opacity: var(--opacity-disabled);
        text-decoration: line-through;
      }
      .hint {
        color: var(--color-text-muted);
        font: var(--t-small);
        margin-top: var(--space-2);
      }
      .crumbs {
        font: var(--t-small);
        color: var(--color-text-muted);
        margin-bottom: var(--space-1-5);
        overflow-wrap: anywhere;
      }
      .crumbs button,
      .link {
        all: unset;
        cursor: pointer;
        color: var(--color-accent);
        text-decoration: underline;
      }
      .insp h2 {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1-5);
        align-items: center;
      }
      .flag {
        font: var(--t-micro);
        padding: var(--space-px) var(--space-2);
        border-radius: var(--radius-full);
        border: 1px solid currentColor;
      }
      .flag.lock {
        color: var(--color-text-muted);
      }
      .flag.rev {
        color: var(--color-warning);
      }
      .geometry {
        font: var(--t-code);
        color: var(--color-text-muted);
      }
      .ann {
        border-left: var(--size-accent-bar) solid var(--c, var(--color-border));
        padding: var(--space-1) 0 var(--space-1) var(--space-3);
        margin: var(--space-3) 0;
      }
      .ann .t {
        font: var(--t-body-strong);
      }
      .ann .l {
        font: var(--t-micro);
        color: var(--color-text-muted);
      }
      dl {
        margin: var(--space-1-5) 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--space-0-5) var(--space-3);
      }
      dt {
        color: var(--color-text-muted);
        font: var(--t-code);
        padding-top: var(--space-px);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--color-text-muted);
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--space-4);
      }
      .cols p {
        margin: 0 0 var(--space-2);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      /* The shortcut table has one row per language; only the chosen one shows. */
      html[data-locale='en-US'] tr[data-locale='pt-BR'],
      html[data-locale='pt-BR'] tr[data-locale='en-US'] {
        display: none;
      }
      .shortcut-note {
        margin: var(--space-2) 0 0;
        color: var(--color-text-muted);
      }
      td,
      th {
        text-align: left;
        padding: var(--space-1-5) var(--space-2);
        border-bottom: 1px solid var(--color-border);
        vertical-align: top;
      }
      .scroll {
        overflow-x: auto;
      }
      .diff {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
      }
      .diff > div {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-2);
      }
      .diff b {
        display: block;
        font: var(--t-micro);
        color: var(--color-text-muted);
        margin-bottom: var(--space-1);
      }
      @media (max-width: 560px) {
        .diff {
          grid-template-columns: 1fr;
        }
      }
      /* Markings: the outline and the fill use the layer's color (currentColor). */
      .mk {
        cursor: pointer;
        color: var(--color-text-muted);
      }
      .mk .box {
        fill: currentColor;
        fill-opacity: var(--opacity-mark-fill);
        stroke: currentColor;
        stroke-width: 1.5;
      }
      .mk.sel .box {
        fill-opacity: var(--opacity-mark-fill-selected);
        stroke-width: 3;
      }
      .mk.review .box {
        stroke-dasharray: 5 3;
      }
      .mk .hit {
        fill: transparent;
      }
      .lock-tag {
        fill: currentColor;
        font: var(--t-small);
        text-anchor: end;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mk .box {
          transition:
            stroke-width var(--duration-fast) var(--easing-standard),
            fill-opacity var(--duration-fast) var(--easing-standard);
        }
      }
    </style>
  </head>
  <body>
    <noscript><!--__NOSCRIPT__--></noscript>
    <div class="wrap">
      <header>
        <h1 data-i18n="heading"></h1>
        <p data-i18n="intro"></p>
        <div class="open">
          <span data-i18n="openInApp"></span>
          <span><span data-i18n="catalogLabel"></span> <kbd>Ctrl+Shift+9</kbd></span>
          <a href="../index.html" data-i18n="openApp"></a>
        </div>
      </header>

      <div class="grid">
        <aside class="panel" data-i18n-aria="stepsHeading">
          <h2 data-i18n="stepsHeading"></h2>
          <ol class="steps" id="steps"></ol>
          <div class="lesson" id="lesson" aria-live="polite"></div>
          <div class="nav">
            <button class="btn" id="prev" data-i18n="previous"></button>
            <button class="btn primary" id="next" data-i18n="next"></button>
          </div>
        </aside>

        <main class="panel" data-i18n-aria="stageLabel">
          <div class="persp">
            <label for="persp" data-i18n="perspectiveLabel"></label>
            <select id="persp"></select>
          </div>
          <div class="tabs" role="tablist" id="tabs"></div>
          <div class="stage">
            <svg id="svg" role="group" data-i18n-aria="svgLabel"></svg>
          </div>
          <div class="layers" id="layers" data-i18n-aria="layersLabel"></div>
          <div class="hint" data-i18n="hint"></div>
        </main>

        <aside class="panel insp" data-i18n-aria="detailsLabel" id="insp"></aside>
      </div>

      <section class="cols">
        <div class="panel">
          <h2 data-i18n="proposalHeading"></h2>
          <p data-i18n="proposalText"></p>
          <div class="diff">
            <div>
              <b data-i18n="diffCurrentLabel"></b><span data-i18n="diffCurrent"></span>
            </div>
            <div>
              <b data-i18n="diffProposedLabel"></b><span data-i18n="diffProposed"></span>
            </div>
          </div>
        </div>
        <div class="panel scroll">
          <h2 data-i18n="shortcutsHeading"></h2>
          <table>
            <tbody>
              <!--__SHORTCUT_ROWS__-->
            </tbody>
          </table>
          <p class="shortcut-note" data-i18n="shortcutNote"></p>
        </div>
        <div class="panel">
          <h2 data-i18n="mcpHeading"></h2>
          <p data-i18n="mcpText"></p>
        </div>
      </section>
    </div>

    <script>
      const D = /*__DATA__*/ null;
      // Texts in the chosen language (already resolved against the app's dictionary at build time)
      // and the example's names in each language; see scripts/guide/messages.ts.
      const GUIDE = /*__MESSAGES__*/ null;
      const LOCALE = document.documentElement.getAttribute('data-locale') || 'en-US';
      const T = GUIDE.messages[LOCALE];
      document.title = T.pageTitle;
      const L = Object.fromEntries(D.layers.map((l) => [l.id, l]));
      const M = Object.fromEntries(D.markings.map((m) => [m.id, m]));
      const A = Object.fromEntries(D.annotations.map((a) => [a.id, a]));
      const IM = Object.fromEntries(D.images.map((i) => [i.id, i]));
      const byName = (img, name) =>
        D.markings.find((m) => IM[m.containerId].name === img && m.name === name);
      const P = D.perspectives;
      // persp: index in P, or null for Main (everything).
      const state = {
        img: D.images[0].id,
        sel: null,
        hidden: new Set(),
        step: 0,
        persp: null,
      };
      const $ = (id) => document.getElementById(id);
      /* Names of the example's items that the texts mention: the one the project has, in any
       language, else the one of the chosen language. */
      const NAME_POOL = new Set([
        ...D.images.map((i) => i.name),
        ...D.markings.map((m) => m.name),
        ...D.layers.map((l) => l.name),
        ...D.annotations.map((a) => a.name),
      ]);
      function nm(key) {
        const names = GUIDE.names[key];
        return (
          [names[LOCALE], ...Object.values(names)].find((n) => NAME_POOL.has(n)) ||
          names[LOCALE]
        );
      }
      /* Fills the {n:key} of a text with the example's names (escaped). */
      function x(text) {
        return text.replace(/\{n:(\w+)\}/g, (_, key) => esc(nm(key)));
      }
      const NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, kids) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        (kids || []).forEach((c) => e.appendChild(c));
        return e;
      }
      function anns(mid) {
        return D.annotations.filter((a) => a.markingId === mid);
      }
      function kind(a) {
        return a.type ? a.type.typeId : a.name || T.noteKind;
      }
      function depth(m) {
        let d = 0;
        while (m.parentId) {
          m = M[m.parentId];
          d++;
        }
        return d;
      }
      function path(m) {
        const p = [];
        while (m) {
          p.unshift(m);
          m = m.parentId ? M[m.parentId] : null;
        }
        return p;
      }
      function inPersp(img) {
        return state.persp === null || P[state.persp].containers.includes(img.id);
      }
      /* Picks the perspective: filters the tabs and switches the chips of the hidden layers. */
      function setPersp(index) {
        state.persp = index;
        state.hidden = new Set(index === null ? [] : P[index].hiddenLayers);
        $('persp').value = index === null ? '' : String(index);
        if (!inPersp(IM[state.img])) {
          state.img = D.images.find(inPersp).id;
          state.sel = null;
        }
      }
      function visible(m) {
        const as = anns(m.id);
        return !as.length || as.some((a) => !state.hidden.has(a.layerId));
      }
      function colorOf(m) {
        const as = anns(m.id).filter((a) => !state.hidden.has(a.layerId));
        return as.length ? L[as[0].layerId].color : null;
      }

      /* Simple drawing of the Material 3 components in the containers with no photo. The colors are
       those of the Material 3 theme (what the component draws), not the Mapping interface's. */
      const M3 = {
        primary: '#6750A4',
        container: '#E8DEF8',
        outline: '#CAC4D0',
        outlineStrong: '#79747E',
        text: '#1D1B20',
        textSoft: '#49454F',
        surface: '#FFFBFE',
        bar: '#F3EDF7',
        track: '#E6E0E9',
        onPrimary: '#FFFFFF',
      };
      /* The texts come from the annotation's own values: the drawing never diverges from the example. */
      function wrap(text, max) {
        const lines = [];
        let line = '';
        for (const word of String(text).split(' ')) {
          if (line && (line + ' ' + word).length > max) {
            lines.push(line);
            line = word;
          } else {
            line = line ? line + ' ' + word : word;
          }
        }
        if (line) lines.push(line);
        return lines;
      }
      function m3(m) {
        const r = m.rect,
          a = anns(m.id).find((x) => x.type && x.type.specId === 'material3-compose'),
          t = a ? a.type.typeId : '',
          v = (a && a.values) || {},
          g = [];
        const add = (tag, at) => g.push(el(tag, at));
        const txt = (x, y, s, sz, fill, anchor, weight) => {
          const e = el('text', {
            x,
            y,
            'font-size': sz,
            fill: fill || M3.text,
            'text-anchor': anchor || 'start',
          });
          if (weight) e.setAttribute('font-weight', weight);
          e.textContent = s;
          g.push(e);
        };
        const on = (value) => value === 'true';
        const X = r.x,
          Y = r.y,
          W = r.width,
          H = r.height;
        if (t === 'top-app-bar') {
          add('rect', { x: X, y: Y, width: W, height: H, fill: M3.bar });
          txt(X + 16, Y + 40, v.title || '', 20);
        } else if (t === 'chip') {
          const sel = on(v.selected);
          add('rect', {
            x: X,
            y: Y,
            width: W,
            height: H,
            rx: 8,
            fill: sel ? M3.container : 'none',
            stroke: sel ? M3.container : M3.outline,
          });
          txt(X + W / 2, Y + H / 2 + 5, v.label || '', 13, M3.text, 'middle');
        } else if (t === 'text-field') {
          add('rect', {
            x: X,
            y: Y + 8,
            width: W,
            height: H - 28,
            rx: 4,
            fill: 'none',
            stroke: M3.outlineStrong,
          });
          txt(X + 14, Y + 22, v.label || '', 11, M3.primary);
          txt(X + 16, Y + 40, v.value || v.placeholder || '', 16);
          if (v.supportingText) txt(X + 16, Y + H - 4, v.supportingText, 12, M3.textSoft);
        } else if (t === 'switch') {
          txt(X, Y + 21, v.label || '', 16);
          const sel = on(v.checked);
          add('rect', {
            x: X + W - 52,
            y: Y + 4,
            width: 52,
            height: 32,
            rx: 16,
            fill: sel ? M3.primary : M3.track,
            stroke: sel ? M3.primary : M3.outlineStrong,
          });
          add('circle', {
            cx: sel ? X + W - 16 : X + W - 36,
            cy: Y + 20,
            r: sel ? 12 : 8,
            fill: sel ? M3.onPrimary : M3.outlineStrong,
          });
        } else if (t === 'checkbox') {
          const checked = v.state === 'checked';
          add('rect', {
            x: X,
            y: Y + 8,
            width: 20,
            height: 20,
            rx: 3,
            fill: checked ? M3.primary : 'none',
            stroke: checked ? M3.primary : M3.outlineStrong,
            'stroke-width': 2,
          });
          txt(X + 30, Y + 25, v.label || '', 16);
        } else if (t === 'card') {
          const outlined = v.style === 'outlined';
          add('rect', {
            x: X,
            y: Y,
            width: W,
            height: H,
            rx: 12,
            fill: outlined ? 'none' : M3.bar,
            stroke: outlined ? M3.outline : 'none',
            'stroke-width': 1.5,
          });
          txt(X + 16, Y + 32, v.title || '', 18);
          if (v.subtitle) txt(X + 16, Y + 54, v.subtitle, 13, M3.textSoft);
          wrap(v.supportingText || '', Math.floor((W - 32) / 7)).forEach((line, i) =>
            txt(X + 16, Y + 82 + i * 18, line, 13),
          );
        } else if (t === 'button') {
          const tonal = v.style === 'tonal';
          add('rect', {
            x: X,
            y: Y,
            width: W,
            height: H,
            rx: H / 2,
            fill: tonal ? M3.container : M3.primary,
          });
          txt(
            X + W / 2,
            Y + H / 2 + 5,
            v.label || '',
            14,
            tonal ? M3.primary : M3.onPrimary,
            'middle',
          );
        } else if (t === 'navigation-bar') {
          add('rect', { x: X, y: Y, width: W, height: H, fill: M3.bar });
          const items = v.items || [];
          items.forEach((item, i) => {
            const cx = X + W / (2 * items.length) + (i * W) / items.length;
            add('rect', {
              x: cx - 32,
              y: Y + 12,
              width: 64,
              height: 30,
              rx: 15,
              fill: on(item.selected) ? M3.container : 'none',
            });
            txt(cx, Y + 62, item.label || '', 12, M3.text, 'middle');
          });
        } else if (t === 'list-item') {
          add('line', {
            x1: X + 16,
            x2: X + W - 16,
            y1: Y + H,
            y2: Y + H,
            stroke: M3.outline,
          });
          add('circle', { cx: X + 40, cy: Y + H / 2, r: 20, fill: M3.container });
          txt(
            X + 40,
            Y + H / 2 + 6,
            (v.headlineContent || '').slice(0, 1),
            16,
            M3.primary,
            'middle',
          );
          txt(X + 76, Y + H / 2 - 2, v.headlineContent || '', 16);
          txt(X + 76, Y + H / 2 + 18, v.supportingContent || '', 13, M3.textSoft);
        } else if (t === 'fab') {
          add('rect', { x: X, y: Y, width: W, height: H, rx: 16, fill: M3.container });
          txt(
            X + W / 2,
            Y + H / 2 + 8,
            v.icon === 'Add' ? '+' : '?',
            24,
            M3.primary,
            'middle',
          );
        }
        // Row, Column and the other containers have no drawing of their own.
        return g;
      }

      function render() {
        const img = IM[state.img],
          svg = $('svg');
        svg.replaceChildren();
        svg.setAttribute('viewBox', '0 0 ' + img.width + ' ' + img.height);
        svg.style.aspectRatio = img.width + '/' + img.height;
        svg.style.width = Math.min(img.width * (img.file ? 1.4 : 1), 720) + 'px';
        if (img.file) {
          svg.appendChild(
            el('image', {
              href: D.files[img.file],
              x: 0,
              y: 0,
              width: img.width,
              height: img.height,
            }),
          );
        } else {
          svg.appendChild(
            el('rect', {
              x: 0,
              y: 0,
              width: img.width,
              height: img.height,
              fill: img.background || M3.surface,
            }),
          );
          D.markings
            .filter((m) => m.containerId === img.id)
            .forEach((m) => m3(m).forEach((n) => svg.appendChild(n)));
        }
        const ms = D.markings
          .filter((m) => m.containerId === img.id && visible(m))
          .sort((a, b) => depth(a) - depth(b));
        ms.forEach((m) => {
          const c = colorOf(m),
            r = m.rect;
          const g = el('g', {
            class:
              'mk' +
              (state.sel === m.id ? ' sel' : '') +
              (m.needsReview ? ' review' : ''),
            tabindex: 0,
            role: 'button',
            'aria-label': m.name,
          });
          if (c) g.style.color = c;
          g.appendChild(
            el('rect', {
              class: 'box',
              x: r.x,
              y: r.y,
              width: r.width,
              height: r.height,
            }),
          );
          g.addEventListener('click', (e) => {
            e.stopPropagation();
            select(m.id);
          });
          g.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              select(m.id);
            }
          });
          svg.appendChild(g);
          if (m.locked) {
            const k = el('text', {
              class: 'lock-tag',
              x: r.x + r.width - 4,
              y: r.y + 14,
            });
            if (c) k.style.color = c;
            k.textContent = 'trancada';
            svg.appendChild(k);
          }
        });
        svg.onclick = () => select(null);
        // tabs
        $('tabs').replaceChildren(
          ...D.images.filter(inPersp).map((i) => {
            const b = document.createElement('button');
            b.className = 'tab';
            b.setAttribute('role', 'tab');
            b.setAttribute('aria-selected', i.id === state.img);
            b.textContent = i.name + (i.file ? '' : ' (' + T.noPhoto + ')');
            b.onclick = () => {
              state.img = i.id;
              state.sel = null;
              render();
              inspect();
            };
            return b;
          }),
        );
        // layers
        const used = new Set(
          D.annotations
            .filter((a) => M[a.markingId].containerId === state.img)
            .map((a) => a.layerId),
        );
        $('layers').replaceChildren(
          ...D.layers
            .filter((l) => used.has(l.id))
            .map((l) => {
              const b = document.createElement('button');
              b.className = 'chip';
              b.setAttribute('aria-pressed', !state.hidden.has(l.id));
              const dot = document.createElement('i');
              dot.style.background = l.color;
              b.append(dot, l.name + (l.spec ? ' · ' + l.spec.specId : ' · ' + T.free));
              b.onclick = () => {
                state.hidden.has(l.id)
                  ? state.hidden.delete(l.id)
                  : state.hidden.add(l.id);
                render();
                inspect();
              };
              return b;
            }),
        );
      }
      function select(id) {
        if (id && M[id].containerId !== state.img) {
          state.img = M[id].containerId;
          if (!inPersp(IM[state.img])) setPersp(null);
        }
        state.sel = id;
        render();
        inspect();
      }
      function fmt(v) {
        if (v === null || v === undefined) return null;
        if (Array.isArray(v)) return v.length ? v.map(fmt).join(' | ') : null;
        if (typeof v === 'object') {
          if (v.annotationId) {
            const a = A[v.annotationId];
            if (!a) return '?';
            const m = M[a.markingId];
            const e = (a.entries || []).find((x) => x.id === v.entryId);
            return (
              '<button class="link" data-go="' +
              m.id +
              '">' +
              esc(m.name) +
              ' › ' +
              esc(a.name || kind(a)) +
              (e ? '.' + esc(e.key) : '') +
              '</button>'
            );
          }
          return Object.entries(v)
            .filter(([k, x]) => k !== '_id' && x !== null)
            .map(([k, x]) => esc(k) + ': ' + fmt(x))
            .join(', ');
        }
        return esc(String(v));
      }
      function esc(s) {
        return s.replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      }
      function inspect() {
        const box = $('insp');
        if (!state.sel) {
          const n = D.markings.filter((m) => m.containerId === state.img).length;
          box.innerHTML =
            '<h2>' +
            T.detailsLabel +
            '</h2><p class="empty">' +
            T.detailsEmpty.replace('%count', n) +
            '</p>';
          return;
        }
        const m = M[state.sel],
          as = anns(m.id);
        let h =
          '<div class="crumbs">' +
          path(m)
            .map((p) => '<button data-go="' + p.id + '">' + esc(p.name) + '</button>')
            .join(' › ') +
          '</div>';
        h +=
          '<h2>' +
          esc(m.name) +
          (m.locked ? '<span class="flag lock">' + T.locked + '</span>' : '') +
          (m.needsReview ? '<span class="flag rev">' + T.needsReview + '</span>' : '') +
          '</h2>';
        h +=
          '<div class="geometry">x ' +
          m.rect.x +
          ' · y ' +
          m.rect.y +
          ' · ' +
          m.rect.width +
          ' × ' +
          m.rect.height +
          '</div>';
        if (!as.length) h += '<p class="empty">' + T.noAnnotations + '</p>';
        as.forEach((a) => {
          const l = L[a.layerId];
          h +=
            '<div class="ann" data-color="' +
            l.color +
            '"><div class="t">' +
            esc(a.name || (a.type ? kind(a) : T.note)) +
            '</div><div class="l">' +
            esc(l.name) +
            (a.type
              ? ' · ' + esc(a.type.specId) + '/' + esc(a.type.typeId)
              : ' · ' + T.freeLayer) +
            '</div>';
          const rows = [];
          if (a.values)
            Object.entries(a.values).forEach(([k, v]) => {
              const f = fmt(v);
              if (f !== null) rows.push([k, f]);
            });
          (a.entries || []).forEach((e) => rows.push([e.key, esc(e.value)]));
          if (rows.length)
            h +=
              '<dl>' +
              rows
                .map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd>')
                .join('') +
              '</dl>';
          h += '</div>';
        });
        box.innerHTML = h;
        // The CSP does not accept style="" in the HTML: the layer color goes in through the CSSOM.
        box.querySelectorAll('[data-color]').forEach((e) => {
          e.style.setProperty('--c', e.dataset.color);
        });
        box
          .querySelectorAll('[data-go]')
          .forEach((b) => (b.onclick = () => select(b.dataset.go)));
      }

      /* Walkthrough */
      function perspectivesText() {
        const names = P.map((p) => '<b>' + esc(p.name) + '</b>').join(T.and);
        const arrival = D.arrivals[0];
        return (
          T.perspectivesIntro +
          names +
          T.perspectivesApp +
          (arrival
            ? T.perspectivesArrival
                .replace('%item', esc(arrival.name))
                .replace('%from', esc(arrival.fromName))
                .replace('%count', D.arrivals.length)
            : '') +
          T.perspectivesEnd
        );
      }
      /* Where each step of the walkthrough points: screen and marking, by the example's names
       (see `nm`); the texts come from the language dictionary, in the same order. */
      const TARGETS = [
        { img: 'signup', sel: null },
        { img: 'signup', sel: ['signup', 'name'] },
        { img: 'signup', sel: ['signup', 'registerButton'] },
        { img: 'signup', sel: ['signup', 'name'] },
        { img: 'signup', sel: ['signup', 'email'] },
        { img: 'signup', sel: ['signup', 'registerButton'] },
        { img: 'signup', sel: ['signup', 'age'] },
        { img: 'signup', sel: ['signup', 'registerButton'] },
        { img: 'signup', sel: ['signup', 'registerButton'] },
        { img: 'login', sel: ['login', 'loginForm'] },
        { img: 'settings', sel: ['settings', 'filters'] },
        { img: 'settings', sel: ['settings', 'notifications'] },
        { img: 'orderDetails', sel: ['orderDetails', 'help'] },
        { img: 'signup', sel: null, persp: true },
      ];
      const S = T.steps.map((step, i) => ({
        ...TARGETS[i],
        t: x(step.t),
        p: x(step.p.replace('%perspectives', perspectivesText())),
        try: x(step.try),
      }));
      function stepRender() {
        $('steps').replaceChildren(
          ...S.map((s, i) => {
            const li = document.createElement('li'),
              b = document.createElement('button');
            b.className = i === state.step ? 'on' : '';
            b.innerHTML =
              '<span class="n">' +
              String(i + 1).padStart(2, '0') +
              '</span><span>' +
              s.t +
              '</span>';
            b.onclick = () => go(i);
            li.appendChild(b);
            return li;
          }),
        );
        const s = S[state.step];
        $('lesson').innerHTML =
          '<h3>' +
          s.t +
          '</h3><p>' +
          s.p +
          '</p><div class="try">' +
          T.try +
          ' ' +
          s.try +
          '</div>';
        $('prev').disabled = state.step === 0;
        $('next').disabled = state.step === S.length - 1;
      }
      function go(i) {
        state.step = i;
        const s = S[i];
        const im = D.images.find((i) => i.name === nm(s.img));
        setPersp(s.persp && P.length ? 0 : null);
        state.img = im.id;
        state.sel = s.sel ? byName(nm(s.sel[0]), nm(s.sel[1])).id : null;
        stepRender();
        render();
        inspect();
      }
      $('persp').replaceChildren(
        ...[['', T.main], ...P.map((p, i) => [String(i), p.name])].map(
          ([value, label]) => {
            const o = document.createElement('option');
            o.value = value;
            o.textContent = label;
            return o;
          },
        ),
      );
      $('persp').onchange = (e) => {
        setPersp(e.target.value === '' ? null : Number(e.target.value));
        render();
        inspect();
      };
      $('prev').onclick = () => go(Math.max(0, state.step - 1));
      $('next').onclick = () => go(Math.min(S.length - 1, state.step + 1));
      // The page's own texts (the markup leaves them empty).
      document.querySelectorAll('[data-i18n]').forEach((e) => {
        e.innerHTML = x(T[e.dataset.i18n]);
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((e) => {
        e.setAttribute('aria-label', x(T[e.dataset.i18nAria]));
      });
      go(0);
    </script>
  </body>
</html>
