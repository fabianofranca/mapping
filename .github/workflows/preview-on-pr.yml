name: Preview do PR

# Quando o CI de um PR termina verde, publica o commit validado em `/preview/`, sem
# `workflow_dispatch` manual. Este workflow só dispara o Deploy
# (`gh workflow run deploy.yml --ref main -f branch=<branch do PR> -f sha=<commit>`); quem
# publica é o `deploy.yml`, que roda na `main` (o ambiente `github-pages` costuma aceitar
# deploy só a partir dela). Com o `sha`, o Deploy confere os check runs `check` e `e2e`
# desse commit e, verdes, não roda o ci.yml do preview de novo (etapa #375): cada commit é
# validado uma vez, pelo CI do PR. Commit superado (CI cancelado) não gera preview.
#
# `workflow_run` roda sempre a versão deste arquivo no branch padrão: mudanças aqui só
# valem depois do merge na `main`.
#
# O `GITHUB_TOKEN` pode disparar `workflow_dispatch` (exceção documentada do GitHub).
# PR de fork fica de fora: o token dele não tem escrita.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: preview-on-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o Deploy do commit validado
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

      - name: Links no resumo
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "Deploy disparado para o branch \`$HEAD_BRANCH\` no commit \`$HEAD_SHA\`, validado pelo CI: $CI_RUN"
            echo
            echo "- Preview: https://${OWNER}.github.io/${repo}/preview/"
            echo "- Execuções do Deploy: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml"
            echo
            echo "Há um preview só: o último PR com CI verde ganha o \`/preview/\`."
          } >> "$GITHUB_STEP_SUMMARY"
