name: CI

# Validates every PR before the merge, once per commit: merges are done from the
# phone, without running anything locally. There is no `push` trigger (stage #375): it repeated
# the PR validation; a branch without a PR has no CI. deploy.yml calls this same workflow
# (`workflow_call`) for `main` and for the preview before publishing: a single list
# of validations, which does not diverge between the PR and the publication.
on:
  pull_request:
    # Editing the PR (title, body or base) does not run the CI. A wrong base is fixed with a new PR,
    # whose `opened` runs the CI, not by changing the base (stage #1466).
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        description: Ref to validate (empty = the event's)
        type: string
        required: false
        default: ''
      label:
        description: Suffix of the artifacts (main, preview), unique within the calling run
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # In a PR, the ref (`refs/pull/<n>/merge`) cancels the superseded commit. In the deploy
  # (`workflow_call`), the event is the Deploy's (push to main or workflow_dispatch) and
  # `inputs.ref` separates its two calls (main and preview).
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

# `timeout-minutes` on every job (stage #1325): close to double the longest time measured in the last 10
# green runs of 2026-11-09, with cache (epic 11 s, static 105 s, test 175 s per
# shard, coverage 31 s, build 186 s, check 4 s, e2e 179 s + 1 min of `playwright install` without
# cache). A job that runs over stops with the maximum-time-exceeded annotation and the `check` (or the
# `e2e`) turns red: the required check finishes instead of staying pending. A timeout is not
# rerun (`ci-rerun.yml`): it is a real defect. The mechanism: the job that overruns ends
# `cancelled`, the CI run ends `cancelled` (not `failure`) and `ci-rerun.yml` is skipped
# by its `if:` (demonstrated in stage #1532, run 42962097957; record in
# https://github.com/fabianofranca/mapping/issues/1532#issuecomment-6787509092). Review these
# values with new measurements.
jobs:
  # `main` only receives a PR from an `epic/*` branch (docs/PROCESS.md, "Workflow"): the "main protegida"
  # ruleset requires this check, which fails for any other origin. Exception: the Dependabot
  # PRs (`dependabot/*`), small and approved by the owner. In the deploy
  # (`workflow_call`) there is no PR: the job is skipped, which GitHub counts as success.
  epic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PR origin
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            epic/*|dependabot/*) allowed=1 ;;
            *) allowed=0 ;;
          esac
          if [ "$BASE" = "main" ] && [ "$allowed" = 0 ]; then
            echo "::error::main only receives a PR from an epic/* branch (origin: $HEAD). Open the PR with the epic branch as its base, not main."
            exit 1
          fi
          echo "PR from $HEAD to $BASE: allowed."
      # Every delivery of epic/<name> to main brings changelog/<name>.md (or
      # changelog/YYYY-MM-DD-<name>.md) in the epic's own PR
      # (docs/PROCESS.md, "Workflow"). Dependabot and PRs to another branch are exempt.
      - name: Changelog updated
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "PR to $BASE: the changelog is only required in PRs to main."
            exit 0
          fi
          case "$HEAD" in
            epic/*) ;;
            *) echo "PR from $HEAD: the changelog is only required in epics."; exit 0 ;;
          esac
          name="${HEAD#epic/}"
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>&1)"; then
            echo "::error::Could not list the files of PR #$PR: $files"
            exit 1
          fi
          # The epic name is compared as text (`-F`), never as a regex; only the optional date
          # at the start of the file name is removed by `sed`.
          if printf '%s\n' "$files" | sed -n 's#^changelog/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-\)\{0,1\}##p' | grep -qxF "$name.md"; then
            echo "changelog of epic $name present in this PR."
          else
            echo "::error::The delivery of $HEAD to main must bring changelog/$name.md (or changelog/YYYY-MM-DD-$name.md)."
            exit 1
          fi
      # The closing of every epic applies the pending items to the design system and records the
      # sync in docs/design-system/<name>.md (or docs/design-system/YYYY-MM-DD-<name>.md)
      # (docs/PROCESS.md, "Workflow"). The DS artifact lives outside the repository and the CI does not
      # reach it; the record here does. An epic with no DS impact also creates the file, to
      # say there was none.
      - name: Design system recorded
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "PR to $BASE: the design system record is only required in PRs to main."
            exit 0
          fi
          case "$HEAD" in
            epic/*) ;;
            *) echo "PR from $HEAD: the design system record is only required in epics."; exit 0 ;;
          esac
          name="${HEAD#epic/}"
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>&1)"; then
            echo "::error::Could not list the files of PR #$PR: $files"
            exit 1
          fi
          if printf '%s\n' "$files" | sed -n 's#^docs/design-system/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-\)\{0,1\}##p' | grep -qxF "$name.md"; then
            echo "design system record of epic $name present in this PR."
          else
            echo "::error::The delivery of $HEAD to main must bring docs/design-system/$name.md (or docs/design-system/YYYY-MM-DD-$name.md): pending items applied and sync, or the record that there was no impact."
            exit 1
          fi
      # The MCP stable release goes out on its own when the epic is merged into main, if `SERVER_VERSION` is new
      # (`mcp-release.yml`, stage #920). So an epic that changes what goes into the release (entries
      # in `scripts/release/releaseInputs.mjs`) must bump the version: it fails here, not at the merge.
      # Dependabot and PRs to another branch are exempt. The checkout brings the history and the tags.
      - uses: actions/checkout@v7
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'epic/')
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: 'Versão do MCP'
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'epic/')
        run: node scripts/release/stableRelease.mjs epic --version-file mcp/version.ts

  # The `check` (the ruleset's required check) is just the aggregator of four parallel jobs:
  # `static`, `test` (+ `coverage`) and `build`. The names of the required checks (`check`,
  # `e2e`, `epic`) do not change (stage #375, decision 4).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, node_modules cache and `npm ci` (local action; refs older than phase 5.6 fall back to Node 22).
      - uses: ./.github/actions/setup-deps
      # ESLint and Prettier caches (`lint:ci`); the local `npm run lint` does not use a cache.
      - uses: actions/cache@v5
        with:
          path: .cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-
      - run: npm run lint:ci
      - run: npm run typecheck

  # Unit and component tests with coverage, in 4 shards balanced by time
  # (tests/support/timedSequencer.ts; `npm run test:durations` regenerates the times); each one
  # uploads the blob with the coverage data, without generating a report (the `coverage` job merges and reports).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, node_modules cache and `npm ci` (local action; refs older than phase 5.6 fall back to Node 22).
      - uses: ./.github/actions/setup-deps
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          COVERAGE_REPORT: off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-${{ matrix.shard }}
          path: .vitest/blob
          if-no-files-found: ignore

  # Merges the shards' blobs: full result, coverage report (no minimum threshold)
  # and summary in the job.
  coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, node_modules cache and `npm ci` (local action; refs older than phase 5.6 fall back to Node 22).
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-*
          path: .vitest/blob
          merge-multiple: true
      - run: npx vitest run --merge-reports --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage (src/)", "", "| Metric | % | Covered |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: coverage
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, node_modules cache and `npm ci` (local action; refs older than phase 5.6 fall back to Node 22).
      - uses: ./.github/actions/setup-deps
      # Per-frame performance budgets: without coverage (it slows the code down).
      - run: npm run test:perf
      # Growth tests: the same operation with n and 4n markings, ratio of the medians below 6×.
      - run: npm run test:scale
      # Types are only checked in `typecheck` (`static` job): `build` and `build:mcp` do not repeat `tsc`.
      - run: npm run build
      - run: npm run build:mcp
      # `--if-present`: the deploy runs this ci.yml (the branch's) also against `main`
      # (`checks-main`), which may not have the viewer script yet (phase L1).
      - run: npm run build:viewer --if-present
      # Last step of the job (stage #1325, decision 7): a `dist` above the ceiling does not hide a failure
      # of `build:mcp` or `build:viewer`, and the `::error` below is the only failure when just the size fails.
      # The ceiling lives in `scripts/ci/dist-budget.json` (stage #1614); what raises it is
      # `node scripts/ci/distBudget.mjs raise --write`, without editing this file.
      - name: Tamanho do dist/index.html
        run: |
          INDEX_HTML_MAX_BYTES=
          if [ -f scripts/ci/dist-budget.json ]; then
            INDEX_HTML_MAX_BYTES=$(node scripts/ci/distBudget.mjs ceiling) || INDEX_HTML_MAX_BYTES=
          fi
          case "$INDEX_HTML_MAX_BYTES" in
            '' | *[!0-9]* | 0)
              echo "::error file=dist/index.html::Budget ceiling not found: no valid scripts/ci/dist-budget.json (ref older than stage #1614: bring in main)."
              exit 1
              ;;
          esac
          size=$(stat -c %s dist/index.html)
          margin=$((INDEX_HTML_MAX_BYTES - size))
          {
            echo "### dist/index.html"
            echo ""
            echo "$size bytes ($((size / 1024)) KiB) of $INDEX_HTML_MAX_BYTES bytes ($((INDEX_HTML_MAX_BYTES / 1024)) KiB) of the budget."
            echo ""
            echo "Margin: $margin bytes ($((margin / 1024)) KiB)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$INDEX_HTML_MAX_BYTES" ]; then
            echo "::error file=dist/index.html::$size bytes, acima do orçamento de $INDEX_HTML_MAX_BYTES bytes."
            exit 1
          fi
          if [ "$margin" -lt 2048 ]; then
            echo "::warning file=dist/index.html::Margem de $margin bytes até o orçamento de $INDEX_HTML_MAX_BYTES bytes, abaixo de 2 KiB: enxugue antes de subir o teto."
          fi

  # Aggregator: the required check `check` fails if any of the four jobs did not end in success.
  check:
    needs: [static, test, coverage, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A job of the check did not end in success: $RESULTS"
              exit 1
            fi
          done

  # End to end on the final `dist/index.html`, on desktop (the app is desktop-only since phase 5.8).
  # It only runs here: the development environment may not be able to download the browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, node_modules cache and `npm ci` (local action; refs older than phase 5.6 fall back to Node 22).
      - uses: ./.github/actions/setup-deps
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The system libraries are not in the browser cache, but the runner image
      # usually has them: `install-deps` (mostly `apt-get update`) only runs if Chromium
      # does not open (a library missing in `ldd` or a failure to start).
      - name: Does Chromium open?
        id: chromium
        run: |
          exe=$(node -p "require('@playwright/test').chromium.executablePath()")
          if [ -x "$exe" ] && ! ldd "$exe" | grep -q 'not found' && "$exe" --headless --no-sandbox --version; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chromium does not open; running install-deps."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chromium.outputs.ok != 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
