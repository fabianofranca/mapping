name: MCP pre-release

# Test channels of the MCP server, before the stable one (`mcp-release.yml`, tag `mcp-v<version>`).
# The code version (`SERVER_VERSION` in `mcp/version.ts`) is one per epic; these channels only
# add a suffix to the build (`MCP_BUILD_SUFFIX`, validated in `mcp/build.mjs`).
#
# - snapshot: every PR based on an `epic/**` generates `mcp-snapshot-pr<N>` (a fixed pre-release,
#   overwritten on every push; version `<version>-snapshot.pr<N>+<short sha>`). When the PR closes
#   (merged or not), the release and the tag are deleted.
# - rc: only goes out on the merge of a PR with the `mcp-rc` label into an `epic/**`: the PR of the epic's
#   last phase (that phase's agent puts the label on when opening the PR). It generates `mcp-v<version>-rc.<n>`
#   (n = that version's largest existing rc + 1) from the merge commit. Without the label, the
#   merge does not generate an rc. If someone forgets the label, run this workflow by hand (`workflow_dispatch`)
#   on the `epic/**` branch. The rcs are deleted by `mcp-release.yml` when the stable of the same
#   version is published.
# The PR's tests run in `ci.yml`; the snapshot does not repeat them. The rc runs them, like the stable.
#
# The PR's code (`npm ci`, build, tests) runs in `*-build` jobs, with only `contents: read` and no
# credential persisted in the checkout; the generated file goes through an artifact to a `*-publish` job,
# the only one with `contents: write`, which does not check out or run the PR's code (stage #971,
# decision 11). The names of the pre-releases and the published files do not change.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ['epic/**']
  workflow_dispatch:

permissions:
  contents: read

# One group per PR: closing (`cleanup`) cancels a snapshot in progress, including between
# `snapshot-build` and `snapshot-publish`, and no `mcp-snapshot-pr<N>` pre-release is left orphaned.
# `workflow_dispatch` (rc only) has its own group per run; the rc serializes separately.
concurrency:
  group: ${{ github.event.pull_request.number && format('mcp-snapshot-pr{0}', github.event.pull_request.number) || format('mcp-dispatch-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  snapshot-build:
    # Fork PRs do not get a write token; only PRs from the repository itself.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Compute the snapshot version
        run: |
          code_version="$(node scripts/release/stableRelease.mjs version --version-file mcp/version.ts)"
          suffix="-snapshot.pr${PR}+${HEAD_SHA:0:7}"
          echo "SERVER_VERSION=$code_version" >> "$GITHUB_ENV"
          echo "MCP_BUILD_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "EXPECTED=${code_version}${suffix}" >> "$GITHUB_ENV"

      - run: npm run build:mcp

      - name: Test the generated file outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "$EXPECTED" ]; then
            echo "--version printed '$got', expected '$EXPECTED'." >&2
            exit 1
          fi
          # The signature extractor (`.mjs`, no dependencies) also runs outside the repository.
          cp "$GITHUB_WORKSPACE/dist-mcp/mapping-signature.mjs" .
          node mapping-signature.mjs --help > /dev/null

      - name: Checksum
        working-directory: dist-mcp
        run: |
          sha256sum mapping-mcp.js > mapping-mcp.js.sha256
          sha256sum mapping-signature.mjs > mapping-signature.mjs.sha256

      # The published files stay together in `release-assets/`: the server, the signature extractor, the `.sha256` files and the
      # workspace ones (the workspace files script runs once).
      - name: Release files
        run: |
          mkdir release-assets
          cp dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 release-assets/
          cp dist-mcp/mapping-signature.mjs dist-mcp/mapping-signature.mjs.sha256 release-assets/
          node scripts/release/workspaceAssets.mjs release-assets > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-snapshot-assets
          path: release-assets
          if-no-files-found: error

  snapshot-publish:
    needs: snapshot-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mcp-snapshot-assets
          path: release-assets

      # The artifact comes from a job that runs the PR's code: it only publishes if it has exactly the
      # expected files (each with its `.sha256`).
      - name: Check the downloaded files
        run: |
          expected="AGENTS.mapping.md AGENTS.mapping.md.sha256 SKILL.md SKILL.md.sha256 mapping-mcp.js mapping-mcp.js.sha256 mapping-signature.mjs mapping-signature.mjs.sha256 setup.sh setup.sh.sha256 watch-comments.mjs watch-comments.mjs.sha256"
          expected="$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')"
          found="$(ls -1 release-assets | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$found" != "$expected" ]; then
            echo "Unexpected files in release-assets: $found (expected: $expected)." >&2
            exit 1
          fi

      - name: Publish to the PR snapshot
        run: |
          tag="mcp-snapshot-pr${PR}"
          title="$tag"
          assets=(release-assets/*)
          notes="Provisional build of PR #${PR}, for testing before it enters the epic. Commit ${HEAD_SHA:0:7}. Overwritten on every push and deleted when the PR closes. It also brings the workspace's \`setup.sh\`, the \`SKILL.md\` skill, the \`AGENTS.mapping.md\` rules and the \`watch-comments.mjs\` watcher, and the \`mapping-signature.mjs\` signature extractor, each with its \`.sha256\`. Installation: \`./setup.sh ${tag}\` (examples/workspace/) or download \`mapping-mcp.js\` and check it with the \`.sha256\`. To update a workspace that still has the old \`setup.sh\`, once: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
          if gh release view "$tag" > /dev/null 2>&1; then
            # It already exists: move the tag to the new commit and replace the files.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$HEAD_SHA" -F force=true
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --prerelease --target "$HEAD_SHA" \
              --title "$title" --notes "$notes"
          fi

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete the PR snapshot
        run: |
          # No checkout: `--repo` is enough. It does not fail if the snapshot does not exist.
          gh release delete "mcp-snapshot-pr${PR}" \
            --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo "No snapshot to delete."

  rc-build:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'mcp-rc') &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/epic/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Per epic (the branch name, the same in the PR and in `workflow_dispatch`, without `refs/heads/`) and
    # without cancelling: a queued rc cannot lose its number. `rc-publish` uses the same
    # group.
    concurrency:
      group: mcp-rc-${{ github.event.pull_request.base.ref || github.ref_name }}
      cancel-in-progress: false
    outputs:
      rc_tag: ${{ steps.number.outputs.rc_tag }}
      version: ${{ steps.number.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      # Without the performance budgets: they fluctuate with the runner (CI measures them separately).
      - run: PERF_BUDGETS=off npm test

      - name: Compute the rc number
        id: number
        run: |
          version="$(node scripts/release/stableRelease.mjs version --version-file mcp/version.ts)"
          # Largest existing rc (tags on the server) + 1. Through the API: the checkout keeps no credential.
          last="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/mcp-v${version}-rc." --paginate --jq '.[].ref' |
            sed -n "s#^refs/tags/mcp-v${version}-rc\.\([0-9][0-9]*\)\$#\1#p" |
            sort -n | tail -1)"
          n=$(( ${last:-0} + 1 ))
          echo "SERVER_VERSION=$version" >> "$GITHUB_ENV"
          echo "MCP_BUILD_SUFFIX=-rc.${n}" >> "$GITHUB_ENV"
          echo "EXPECTED=${version}-rc.${n}" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rc_tag=mcp-v${version}-rc.${n}" >> "$GITHUB_OUTPUT"

      - run: npm run build:mcp

      - name: Test the generated file outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "$EXPECTED" ]; then
            echo "--version printed '$got', expected '$EXPECTED'." >&2
            exit 1
          fi
          # The signature extractor (`.mjs`, no dependencies) also runs outside the repository.
          cp "$GITHUB_WORKSPACE/dist-mcp/mapping-signature.mjs" .
          node mapping-signature.mjs --help > /dev/null

      - name: Checksum
        working-directory: dist-mcp
        run: |
          sha256sum mapping-mcp.js > mapping-mcp.js.sha256
          sha256sum mapping-signature.mjs > mapping-signature.mjs.sha256

      # The published files stay together in `release-assets/` (the workspace files
      # script runs once).
      - name: Release files
        run: |
          mkdir release-assets
          cp dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 release-assets/
          cp dist-mcp/mapping-signature.mjs dist-mcp/mapping-signature.mjs.sha256 release-assets/
          node scripts/release/workspaceAssets.mjs release-assets > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-rc-assets
          path: release-assets
          if-no-files-found: error

  rc-publish:
    needs: rc-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mcp-rc-${{ github.event.pull_request.base.ref || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      EPIC: ${{ github.event.pull_request.base.ref || github.ref_name }}
      RC_TAG: ${{ needs.rc-build.outputs.rc_tag }}
      SERVER_VERSION: ${{ needs.rc-build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mcp-rc-assets
          path: release-assets

      # The artifact comes from a job that runs the PR's code: it only publishes if it has exactly the
      # expected files (each with its `.sha256`).
      - name: Check the downloaded files
        run: |
          expected="AGENTS.mapping.md AGENTS.mapping.md.sha256 SKILL.md SKILL.md.sha256 mapping-mcp.js mapping-mcp.js.sha256 mapping-signature.mjs mapping-signature.mjs.sha256 setup.sh setup.sh.sha256 watch-comments.mjs watch-comments.mjs.sha256"
          expected="$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')"
          found="$(ls -1 release-assets | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$found" != "$expected" ]; then
            echo "Unexpected files in release-assets: $found (expected: $expected)." >&2
            exit 1
          fi

      - name: Publish the release candidate
        run: |
          # The values come from the job that built the PR's code: check the format before using them.
          if ! printf '%s' "$RC_TAG" | grep -Eq '^mcp-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "Invalid rc tag: $RC_TAG." >&2
            exit 1
          fi
          assets=(release-assets/*)
          gh release create "$RC_TAG" \
            "${assets[@]}" \
            --prerelease --target "$TARGET_SHA" \
            --title "$RC_TAG" \
            --notes "Release candidate of epic \`${EPIC}\`, commit ${TARGET_SHA:0:7}. Provisional: deleted when the stable mcp-v${SERVER_VERSION} is published. It also brings the workspace's \`setup.sh\`, the \`SKILL.md\` skill, the \`AGENTS.mapping.md\` rules and the \`watch-comments.mjs\` watcher, and the \`mapping-signature.mjs\` signature extractor, each with its \`.sha256\`. Installation: \`./setup.sh ${RC_TAG}\` (examples/workspace/) or download \`mapping-mcp.js\` and check it with the \`.sha256\`. To update a workspace that still has the old \`setup.sh\`, once: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${RC_TAG}/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
