name: Deploy

# Push na `main`: publica só a `main` em `/`.
# `workflow_dispatch` com um branch diferente da `main`: publica a `main` em `/`
# e o branch em `/preview/`, com `VITE_CHANNEL=preview` (armazenamento separado,
# faixa de aviso e manifest próprio). A produção nunca é substituída.
#
# Antes de publicar, a `main` e o preview passam pelo ci.yml inteiro (lint, typecheck,
# testes, desempenho, build, build:mcp, orçamento de tamanho e e2e). Se qualquer um
# falhar, nada é publicado.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a publicar em /preview/ (vazio = o escolhido em "Use workflow from")
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.preview.outputs.ref }}
    steps:
      - name: Decide se há preview
        id: preview
        env:
          PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || '' }}
        run: |
          ref="${PREVIEW_REF#refs/heads/}"
          if [ -n "$ref" ] && [ "$ref" != "main" ]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

  checks-main:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: main
      label: main

  checks-preview:
    needs: plan
    if: needs.plan.outputs.preview != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.preview }}
      label: preview

  build:
    needs: [plan, checks-main, checks-preview]
    # O preview é opcional (pulado quando não há), mas, se houver, precisa passar.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.checks-main.result == 'success' &&
      (needs.checks-preview.result == 'success' ||
       (needs.checks-preview.result == 'skipped' && needs.plan.outputs.preview == ''))
    runs-on: ubuntu-latest
    env:
      PREVIEW: ${{ needs.plan.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v7
        with:
          # Até a fase 5.6 entrar na main, ela não tem .nvmrc: Node 22.
          node-version-file: ${{ hashFiles('main/.nvmrc') != '' && 'main/.nvmrc' || '' }}
          node-version: ${{ hashFiles('main/.nvmrc') == '' && '22' || '' }}
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Versão principal
        working-directory: main
        run: |
          npm ci
          npm run build

      - uses: actions/checkout@v4
        if: env.PREVIEW != ''
        with:
          ref: ${{ env.PREVIEW }}
          path: preview

      - name: Preview
        if: env.PREVIEW != ''
        working-directory: preview
        # `VITE_CHANNEL` só no build: os testes (no ci.yml) rodam como a versão principal.
        run: |
          npm ci
          VITE_CHANNEL=preview npm run build

      - name: Monta o site
        run: |
          mkdir site
          cp -R main/dist/. site/
          if [ -d preview/dist ]; then
            mkdir site/preview
            cp -R preview/dist/. site/preview/
          fi

      # O index.html avulso, para abrir por file:// (o do preview usa os dados do preview).
      - uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: main/dist/index.html
      - uses: actions/upload-artifact@v4
        if: env.PREVIEW != ''
        with:
          name: index-html-preview
          path: preview/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
