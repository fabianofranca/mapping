name: Deploy

# Push to `main`: publishes only `main`, at `/`.
# `workflow_dispatch` with a branch other than `main`: publishes `main` at `/`
# and the branch at `/preview/`, with `VITE_CHANNEL=preview` (separate storage,
# notice banner and its own manifest). Production is never replaced by something unvalidated.
#
# `preview-on-pr.yml` triggers this `workflow_dispatch` when a PR's CI finishes green,
# with the branch and the validated `sha`. There is **only one preview**: the last PR with green
# CI gets `/preview/`. Pages publishes a single
# artifact (production and preview together), so every run republishes production.
#
# Every deploy writes `deploy.json` at the site root with the published `main` commit: what is
# published already passed the whole ci.yml (lint, typecheck, tests, performance, build,
# build:mcp, size budget and e2e) when it was published.
# - Without preview (push to `main`): `main` must pass the checks, otherwise nothing is published.
# - With preview: the branch must pass. With a `sha` whose check runs `check` and `e2e` (from the
#   PR's CI) are `success`, it already passed: `checks-preview` is skipped and that SHA is
#   published (stage #375, one validation per commit). Without `sha` (manual dispatch) or without the
#   green check runs, `checks-preview` runs ci.yml on the branch (or on the SHA) as usual. The `main` checks only run if it changed since the
#   published `deploy.json`; if they fail (flakiness, for example), production is
#   republished from the already published commit and the preview goes out anyway. Without an
#   accessible `deploy.json` (first deploy), a `main` failure still blocks.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish at /preview/ (empty = the one chosen in "Use workflow from")
        required: false
        default: ''
      sha:
        description: Branch commit to publish (empty = the branch tip); with green check and e2e, it does not validate again
        required: false
        default: ''

# Workflow level: read-only. `pages: write` and `id-token: write` live in the `deploy` job, the only
# one that publishes; `plan` and `build` run code from the preview branch (stage #971, item 74).
permissions:
  contents: read

# No `concurrency` at the workflow level: it would cancel the whole run, including a
# `deploy` already in progress (stage #971, item 75, decision 10). `build` cancels the superseded
# `build` (`pages-build`) and `deploy` has the `pages` group without cancelling.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.preview.outputs.ref }}
      preview_sha: ${{ steps.preview.outputs.sha }}
      validated: ${{ steps.validated.outputs.validated }}
      main_head: ${{ steps.main.outputs.main_head }}
      published: ${{ steps.main.outputs.published }}
      check_main: ${{ steps.main.outputs.check_main }}
    steps:
      - name: Decide whether there is a preview
        id: preview
        env:
          PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || '' }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          ref="${PREVIEW_REF#refs/heads/}"
          if [ -n "$ref" ] && [ "$ref" != "main" ]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            if [ -n "$SHA" ]; then
              if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
                echo "::error::invalid sha: $SHA (expected the full SHA, 40 hexadecimal characters)."
                exit 1
              fi
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Did the PR's CI already validate this commit? The `check` and `e2e` check runs are the jobs of
      # ci.yml on the `pull_request` event (the ones from `checks-preview` are named
      # `checks-preview / check`). Both `success`: it does not validate again. A query that
      # fails counts as not validated: checks-preview runs, as in a manual dispatch.
      - name: Check whether the commit was already validated
        id: validated
        if: steps.preview.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.preview.outputs.sha }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name')" || passed=""
          validated=true
          for name in check e2e; do
            if ! printf '%s\n' "$passed" | grep -qx "$name"; then
              validated=false
              echo "Check run \`$name\` without success on \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "- preview commit \`$SHA\` already validated by the PR's CI: $validated" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide what to validate on main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.preview.outputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          repo="${GITHUB_REPOSITORY#*/}"
          published="$(curl -fsSL "https://${OWNER}.github.io/${repo}/deploy.json" | jq -r '.main // empty' 2>/dev/null || true)"
          check_main=true
          if [ -n "$PREVIEW" ] && [ -n "$published" ] && [ "$published" = "$main_head" ]; then
            check_main=false
          fi
          {
            echo "main_head=$main_head"
            echo "published=$published"
            echo "check_main=$check_main"
          } >> "$GITHUB_OUTPUT"
          {
            echo "- current main: \`$main_head\`"
            echo "- published main (deploy.json): \`${published:-unknown}\`"
            echo "- preview: \`${PREVIEW:-none}\`"
            echo "- main checks: $check_main"
          } >> "$GITHUB_STEP_SUMMARY"

  checks-main:
    needs: plan
    if: needs.plan.outputs.check_main == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.main_head }}
      label: main

  # Skipped when the PR's CI already validated the commit (`validated`).
  checks-preview:
    needs: plan
    if: needs.plan.outputs.preview != '' && needs.plan.outputs.validated != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.preview_sha || needs.plan.outputs.preview }}
      label: preview

  build:
    needs: [plan, checks-main, checks-preview]
    # Production resolved: checks-main succeeded or (there is a preview and an already published commit).
    # The preview is optional (skipped when there is none), but if there is one, it must pass: in
    # checks-preview or, before that, in the PR's CI (skipped through `validated`).
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.checks-main.result == 'success' ||
       (needs.plan.outputs.preview != '' && needs.plan.outputs.published != '')) &&
      (needs.checks-preview.result == 'success' ||
       (needs.checks-preview.result == 'skipped' && needs.plan.outputs.preview == '') ||
       (needs.checks-preview.result == 'skipped' && needs.plan.outputs.validated == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `configure-pages` only reads the Pages configuration (GET /pages); writing is up to `deploy`.
      pages: read
    concurrency:
      group: pages-build
      cancel-in-progress: true
    env:
      PREVIEW: ${{ needs.plan.outputs.preview }}
      # The validated commit (the dispatch's `sha`) or, without it, the branch tip.
      PREVIEW_REF: ${{ needs.plan.outputs.preview_sha || needs.plan.outputs.preview }}
      MAIN_REF: ${{ needs.checks-main.result == 'success' && needs.plan.outputs.main_head || needs.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_REF }}
          path: main
      - uses: actions/setup-node@v7
        with:
          # main has had .nvmrc since phase 5.6; the Node 22 fallback is for publishing
          # a preview of a branch older than that.
          node-version-file: ${{ hashFiles('main/.nvmrc') != '' && 'main/.nvmrc' || '' }}
          node-version: ${{ hashFiles('main/.nvmrc') == '' && '22' || '' }}
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Main version
        working-directory: main
        run: |
          npm ci
          npm run build

      - uses: actions/checkout@v7
        if: env.PREVIEW != ''
        with:
          ref: ${{ env.PREVIEW_REF }}
          path: preview

      - name: Preview
        if: env.PREVIEW != ''
        working-directory: preview
        # `VITE_CHANNEL` only in the build: the tests (in ci.yml) run as the main version.
        run: |
          npm ci
          VITE_CHANNEL=preview npm run build

      - name: Assemble the site
        run: |
          mkdir site
          cp -R main/dist/. site/
          if [ -d preview/dist ]; then
            mkdir site/preview
            cp -R preview/dist/. site/preview/
          fi
          # Published `main` commit: plan reads this on the next deploy.
          preview_sha=""
          if [ -d preview/dist ]; then preview_sha="$(git -C preview rev-parse HEAD)"; fi
          jq -n \
            --arg main "$(git -C main rev-parse HEAD)" \
            --arg preview "$PREVIEW" \
            --arg previewSha "$preview_sha" \
            '{main: $main, preview: (if $preview == "" then null else $preview end), previewSha: (if $previewSha == "" then null else $previewSha end)}' \
            > site/deploy.json
          cat site/deploy.json

      - name: Warn if production came from the already published commit
        # Skipped (main unchanged since the published one) is not a failure: it only warns when it ran and did not pass.
        if: needs.checks-main.result != 'success' && needs.checks-main.result != 'skipped'
        env:
          MAIN_HEAD: ${{ needs.plan.outputs.main_head }}
          PUBLISHED: ${{ needs.plan.outputs.published }}
        run: |
          msg="main checks failed on $MAIN_HEAD; production was republished from the already published commit $PUBLISHED."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # The standalone index.html, to open through file:// (the preview's uses the preview's data).
      - uses: actions/upload-artifact@v7
        with:
          name: index-html
          path: main/dist/index.html
      - uses: actions/upload-artifact@v7
        if: env.PREVIEW != ''
        with:
          name: index-html-preview
          path: preview/dist/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # Without this `if`, the implicit `success()` requires every ancestor to succeed, including the
    # `checks-preview` skipped when there is no preview: the deploy was skipped on every push to main.
    # The quality gate is `build`'s, which already requires checks-main (and checks-preview, if any).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # A Deploy in the `deploy` job is not cancelled by another: the next one waits (GitHub
    # recommends this group, without cancelling, for Pages).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
