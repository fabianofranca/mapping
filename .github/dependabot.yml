# Atualizações semanais de dependências, em poucos PRs para o dono aprovar pelo celular:
# minor e patch agrupados num PR por ecossistema; major chega em PR próprio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham a versão mínima de Node suportada (.nvmrc; o MCP promete
      # Node ≥ 20), não a mais nova: tipos de um Node acima deixam passar APIs que não
      # existem onde o código roda. Patches e minors da linha atual continuam chegando.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Migrações adiadas para depois do marco "Uso real" (docs/ROADMAP.md, Evoluções):
      # TypeScript 7 (typescript-eslint ainda exige TS < 6.1) e Preact 11 (tipos JSX dos
      # controles mudaram). Cada uma entra como fase própria; retire a regra ao começar.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: preact
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
