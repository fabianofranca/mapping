name: 'CI: reexecução de runner abandonado'

# Quando o CI de um PR termina vermelho porque o GitHub abandonou um runner (o job some da
# lista de jobs da execução; ex.: runs 42672468793 e 42672325637), roda de novo os jobs
# falhos/ausentes, uma vez, sem sessão nem dono no meio (etapa #1325). A regra "morreu por
# runner abandonado" está em `scripts/ci/ciRerun.mjs` (testada em `tests/tooling/ciRerun.test.ts`):
# falha legítima (teste, lint, build) não é reexecutada, porque a fase precisa corrigir o código
# de qualquer forma. O timeout tem dois casos:
#   - No timeout sozinho, o job termina `cancelled` e a execução do CI também (não `failure`):
#     este workflow nem roda, pulado pelo `if:` do job `rerun`.
#   - Numa execução `failure` por outro motivo, o job `cancelled` conta como falha legítima no
#     `decide`, como confere o teste "job cancelado conta como falha legítima" de
#     `tests/tooling/ciRerun.test.ts`.
#
# A demonstração real foi feita na etapa #1532, com os PRs #1586 e #1587 (registro em
# https://github.com/fabianofranca/mapping/issues/1532#issuecomment-6787509092). Para simular o
# abandono num branch descartável, além de tirar o job `epic`, é preciso fazer o `check` falhar
# só na tentativa 1 e trocar o vitest dos `test`, do `coverage` e do `e2e` por `echo`, porque os
# testes de `tests/tooling` leem o `ci.yml` do branch.
#
# Só a tentativa 1 (`run_attempt == 1`): uma reexecução por commit, nunca em laço. A tentativa 2
# nunca dispara outra; se houver uma segunda reexecução, ela é da fase. Fork e Dependabot ficam
# de fora (o `workflow_run` deles recebe token só de leitura e a reexecução falharia à toa).
#
# Os jobs esperados vêm do `ci.yml` da `main` (checkout sparse, sem código do PR, que não é
# confiável). `workflow_run` roda sempre a versão deste arquivo no branch padrão: mudanças aqui
# só valem depois do merge na `main`. Este workflow não é check obrigatório: nunca deixa check
# pendente.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: ci-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci
          sparse-checkout-cone-mode: false
      - name: Decide se reexecuta
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/jobs.json"
          node scripts/ci/ciRerun.mjs decide --ci .github/workflows/ci.yml --jobs "$RUNNER_TEMP/jobs.json" --output "$GITHUB_OUTPUT"
      - name: Reexecuta os jobs abandonados
        if: steps.decide.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
      - name: Resumo
        if: always()
        env:
          OUTCOME: ${{ steps.decide.outcome }}
          RERUN: ${{ steps.decide.outputs.rerun }}
          ABANDONED: ${{ steps.decide.outputs.abandoned }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "não reexecuta: a decisão falhou ($OUTCOME); veja o log do passo anterior" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RERUN" = "true" ]; then
            echo "reexecuta: abandonados $ABANDONED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "não reexecuta: $REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
