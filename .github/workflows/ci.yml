name: CI

# Valida todo PR antes do merge, uma vez por commit: os merges são feitos pelo
# celular, sem rodar nada localmente. Não há gatilho `push` (etapa #375): ele repetia
# a validação do PR; branch sem PR não tem CI. O deploy.yml chama este mesmo workflow
# (`workflow_call`) para a `main` e para o preview antes de publicar: uma só lista
# de validações, que não diverge entre o PR e a publicação.
on:
  pull_request:
    # `edited` entra só pela troca de base (etapa #974): um PR de `fix/x` com base `epic/y` passa
    # no job `epic`, e ao trocar a base para a `main` o CI precisa rodar de novo. Na edição de
    # título ou corpo (sem `changes.base`) todo job é pulado pela condição `github.event.action != 'edited' || github.event.changes.base` abaixo.
    # Risco conhecido e aceito pelo dono (2026-11-08): o GitHub conta job pulado como sucesso,
    # então editar o título de um PR com `check` ou `epic` vermelho cria checks "pulados" mais
    # novos no mesmo commit, que contam como verdes. No `workflow_call` (deploy) não há
    # `github.event.action`, e a condição é verdadeira.
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      ref:
        description: Ref a validar (vazio = o do evento)
        type: string
        required: false
        default: ''
      label:
        description: Sufixo dos artifacts (main, preview), únicos na execução que chama
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Num PR, o ref (`refs/pull/<n>/merge`) cancela o commit superado. No deploy
  # (`workflow_call`), o evento é o do Deploy (push na main ou workflow_dispatch) e
  # `inputs.ref` separa as duas chamadas dele (main e preview).
  # A edição sem troca de base ganha um sufixo único (`run_id`): sua execução (toda pulada) não
  # cancela o CI em andamento do mesmo commit. A troca de base fica no grupo de sempre e
  # substitui a execução anterior.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # A `main` só recebe PR de um branch `epic/*` (CLAUDE.md, "Fluxo de trabalho"): o ruleset
  # "main protegida" exige este check, que falha para qualquer outra origem. Exceção: os PRs
  # do Dependabot (`dependabot/*`), pequenos e aprovados pelo dono. No deploy
  # (`workflow_call`) não há PR: o job é pulado, o que o GitHub conta como sucesso.
  epic:
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    steps:
      - name: Origem do PR
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            epic/*|dependabot/*) allowed=1 ;;
            *) allowed=0 ;;
          esac
          if [ "$BASE" = "main" ] && [ "$allowed" = 0 ]; then
            echo "::error::A main só recebe PR de um branch epic/* (origem: $HEAD). Abra o PR com base no branch do épico, não na main."
            exit 1
          fi
          echo "PR de $HEAD para $BASE: permitido."
      # Toda entrega de epic/<nome> para a main traz changelog/<nome>.md (ou
      # changelog/AAAA-MM-DD-<nome>.md) no próprio PR do épico
      # (CLAUDE.md, "Fluxo de trabalho"). Dependabot e PRs para outro branch não entram.
      - name: Changelog atualizado
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "PR para $BASE: o changelog só é exigido nos PRs para a main."
            exit 0
          fi
          case "$HEAD" in
            epic/*) ;;
            *) echo "PR de $HEAD: o changelog só é exigido nos épicos."; exit 0 ;;
          esac
          name="${HEAD#epic/}"
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>&1)"; then
            echo "::error::Não foi possível listar os arquivos do PR #$PR: $files"
            exit 1
          fi
          # O nome do épico é comparado como texto (`-F`), nunca como regex; só a data opcional
          # do começo do arquivo sai por `sed`.
          if printf '%s\n' "$files" | sed -n 's#^changelog/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-\)\{0,1\}##p' | grep -qxF "$name.md"; then
            echo "changelog do épico $name presente neste PR."
          else
            echo "::error::A entrega de $HEAD para a main precisa trazer changelog/$name.md (ou changelog/AAAA-MM-DD-$name.md)."
            exit 1
          fi
      # O fechamento de todo épico aplica as pendências no design system e registra a
      # sincronização em docs/design-system/<nome>.md (ou docs/design-system/AAAA-MM-DD-<nome>.md)
      # (CLAUDE.md, "Fluxo de trabalho"). O artefato do DS vive fora do repositório e o CI não
      # o alcança; o registro aqui, sim. Um épico sem impacto no DS também cria o arquivo, para
      # dizer que não houve.
      - name: Design system registrado
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "PR para $BASE: o registro do design system só é exigido nos PRs para a main."
            exit 0
          fi
          case "$HEAD" in
            epic/*) ;;
            *) echo "PR de $HEAD: o registro do design system só é exigido nos épicos."; exit 0 ;;
          esac
          name="${HEAD#epic/}"
          if ! files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>&1)"; then
            echo "::error::Não foi possível listar os arquivos do PR #$PR: $files"
            exit 1
          fi
          if printf '%s\n' "$files" | sed -n 's#^docs/design-system/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-\)\{0,1\}##p' | grep -qxF "$name.md"; then
            echo "registro do design system do épico $name presente neste PR."
          else
            echo "::error::A entrega de $HEAD para a main precisa trazer docs/design-system/$name.md (ou docs/design-system/AAAA-MM-DD-$name.md): pendências aplicadas e sincronização, ou o registro de que não houve impacto."
            exit 1
          fi
      # A estável do MCP sai sozinha no merge do épico na main quando a `SERVER_VERSION` é nova
      # (`mcp-release.yml`, etapa #920). Por isso o épico que muda o que vai na release (entradas
      # em `scripts/release/releaseInputs.mjs`) precisa subir a versão: falha aqui, não no merge.
      # Dependabot e PRs para outro branch não entram. O checkout traz o histórico e as tags.
      - uses: actions/checkout@v7
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'epic/')
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Versão do MCP
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'epic/')
        run: node scripts/release/stableRelease.mjs epic --version-file mcp/version.ts

  # O `check` (check obrigatório do ruleset) é só o agregador de quatro jobs em paralelo:
  # `static`, `test` (+ `coverage`) e `build`. Os nomes dos checks obrigatórios (`check`,
  # `e2e`, `epic`) não mudam (etapa #375, decisão 4).
  static:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, cache de node_modules e `npm ci` (ação local; refs anteriores à fase 5.6 caem no Node 22).
      - uses: ./.github/actions/setup-deps
      # Caches do ESLint e do Prettier (`lint:ci`); o `npm run lint` local não usa cache.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.*', 'eslint-suppressions.json', '.prettierrc*') }}-
      - run: npm run lint:ci
      - run: npm run typecheck

  # Testes unitários e de componentes com cobertura, em 4 shards balanceados por tempo
  # (tests/support/timedSequencer.ts; `npm run test:durations` regenera os tempos); cada um
  # sobe o blob com os dados de cobertura, sem gerar relatório (o job `coverage` junta e relata).
  test:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, cache de node_modules e `npm ci` (ação local; refs anteriores à fase 5.6 caem no Node 22).
      - uses: ./.github/actions/setup-deps
      - run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          COVERAGE_REPORT: off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-${{ matrix.shard }}
          path: .vitest/blob
          if-no-files-found: ignore

  # Junta os blobs dos shards: resultado completo, relatório de cobertura (sem limite mínimo)
  # e resumo no job.
  coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, cache de node_modules e `npm ci` (ação local; refs anteriores à fase 5.6 caem no Node 22).
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob${{ inputs.label && format('-{0}', inputs.label) || '' }}-*
          path: .vitest/blob
          merge-multiple: true
      - run: npx vitest run --merge-reports --coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Cobertura (src/)", "", "| Métrica | % | Cobertos |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: coverage
          if-no-files-found: ignore

  build:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    env:
      # Orçamento do dist/index.html (autocontido; 1.376.757 bytes, ~1,38 MB em 2026-10-19, com o exemplo embutido: ~80 KB em base64). Só aqui. Subido para 1.703.936 (1,625 MiB) na etapa #559 (decisão do dono, 2026-11-05): o épico estava a 151 bytes do teto e a PD5 soma ~7,4 KB de código real. Subido para 1.769.472 (1.728 KiB) na CM5 da etapa #645: o compositor com chips, o `@`, os menus de citação e o chip vivo somam ~38 KB de código real (1.738.403 bytes), com ~31 KB de folga. Subido para 1.867.776 (1.824 KiB) na PE3 da etapa #659: a interface das perspectivas (seletor, três diálogos, submenu, seção e aviso nos Detalhes, selo e área de chegada no canvas) soma ~66 KB de código real (1.804.237 bytes), com ~63 KB de folga. Subido para 1.884.160 (1.840 KiB) na etapa #842 (decisão do dono, 2026-11-08): a `main` já estava a ~300 bytes do teto e os atributos `data-viewport` e `data-selection-box` somam ~700 bytes. Subido para 1.900.544 (1.856 KiB) na etapa revisao-propostas (decisão do dono, 2026-11-09): o épico, com a `main` trazida, passou 227 bytes do teto antigo. Subido para 1.933.312 (1.888 KiB) na etapa #964 (decisão do dono, 2026-11-09): a Ajuda da formatVersion 15 (`src/i18n/specHelp.ts`, +156 linhas) levou o épico, com a `main` trazida, a 1.905.789 bytes.
      INDEX_HTML_MAX_BYTES: 1933312
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, cache de node_modules e `npm ci` (ação local; refs anteriores à fase 5.6 caem no Node 22).
      - uses: ./.github/actions/setup-deps
      # Orçamentos de desempenho por quadro: sem cobertura (ela deixa o código mais lento).
      - run: npm run test:perf
      # Testes de crescimento: a mesma operação com n e 4n marcações, razão das medianas abaixo de 6×.
      - run: npm run test:scale
      # Os tipos ficam só no `typecheck` (job `static`): `build` e `build:mcp` não repetem o `tsc`.
      - run: npm run build
      - name: Tamanho do dist/index.html
        run: |
          size=$(stat -c %s dist/index.html)
          {
            echo "### dist/index.html"
            echo ""
            echo "$size bytes ($((size / 1024)) KiB) de $INDEX_HTML_MAX_BYTES bytes ($((INDEX_HTML_MAX_BYTES / 1024)) KiB) do orçamento."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$INDEX_HTML_MAX_BYTES" ]; then
            echo "::error file=dist/index.html::$size bytes, acima do orçamento de $INDEX_HTML_MAX_BYTES bytes."
            exit 1
          fi
      - run: npm run build:mcp
      # `--if-present`: o deploy roda este ci.yml (o do branch) também contra a `main`
      # (`checks-main`), que pode ainda não ter o script do visualizador (fase L1).
      - run: npm run build:viewer --if-present

  # Agregador: o check obrigatório `check` falha se algum dos quatro jobs não terminou em sucesso.
  check:
    needs: [static, test, coverage, build]
    if: ${{ always() && (github.event.action != 'edited' || github.event.changes.base) }}
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs em sucesso
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Algum job do check não terminou em success: $RESULTS"
              exit 1
            fi
          done

  # Ponta a ponta no `dist/index.html` final, no desktop (a app é só desktop desde a fase 5.8).
  # Só roda aqui: o ambiente de desenvolvimento pode não conseguir baixar o navegador.
  e2e:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Node, cache de node_modules e `npm ci` (ação local; refs anteriores à fase 5.6 caem no Node 22).
      - uses: ./.github/actions/setup-deps
      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # As bibliotecas do sistema não ficam no cache do navegador, mas a imagem do runner
      # costuma tê-las: o `install-deps` (quase tudo `apt-get update`) só roda se o Chromium
      # não abrir (biblioteca faltando no `ldd` ou falha ao iniciar).
      - name: Chromium abre?
        id: chromium
        run: |
          exe=$(node -p "require('@playwright/test').chromium.executablePath()")
          if [ -x "$exe" ] && ! ldd "$exe" | grep -q 'not found' && "$exe" --headless --no-sandbox --version; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "O Chromium não abre; rodando o install-deps."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chromium.outputs.ok != 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
