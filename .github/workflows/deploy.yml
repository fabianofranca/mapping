name: Deploy

# Push na `main`: publica só a `main` em `/`.
# `workflow_dispatch` com um branch diferente da `main`: publica a `main` em `/`
# e o branch em `/preview/`, com `VITE_CHANNEL=preview` (armazenamento separado,
# faixa de aviso e manifest próprio). A produção nunca é substituída.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a publicar em /preview/ (vazio = o escolhido em "Use workflow from")
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Versão principal
        working-directory: main
        # Orçamentos de desempenho fora da suíte paralela (disputam CPU com ela): no
        # push da main, medidos depois, sozinhos. Ao publicar um preview, a main já
        # foi medida no push dela: só os testes funcionais. O `--exclude` vale também
        # para versões da main anteriores ao `PERF_BUDGETS=off` do vite.config.ts.
        run: |
          npm ci
          npm run lint
          PERF_BUDGETS=off npm test -- --exclude tests/model/performance.test.ts
          if [ -z "$PREVIEW_REF" ]; then npm run test:perf; fi
          npm run build

      - name: Decide se há preview
        id: preview
        run: |
          ref="${PREVIEW_REF#refs/heads/}"
          if [ -n "$ref" ] && [ "$ref" != "main" ]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preview.outputs.ref != ''
        with:
          ref: ${{ steps.preview.outputs.ref }}
          path: preview

      - name: Preview
        if: steps.preview.outputs.ref != ''
        working-directory: preview
        # `VITE_CHANNEL` só no build: os testes rodam como a versão principal.
        run: |
          npm ci
          npm run lint
          PERF_BUDGETS=off npm test
          npm run test:perf
          VITE_CHANNEL=preview npm run build

      - name: Monta o site
        run: |
          mkdir site
          cp -R main/dist/. site/
          if [ -d preview/dist ]; then
            mkdir site/preview
            cp -R preview/dist/. site/preview/
          fi

      # O index.html avulso, para abrir por file:// (o do preview usa os dados do preview).
      - uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: main/dist/index.html
      - uses: actions/upload-artifact@v4
        if: steps.preview.outputs.ref != ''
        with:
          name: index-html-preview
          path: preview/dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
