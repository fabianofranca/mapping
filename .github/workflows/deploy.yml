name: Deploy

# Push na `main`: publica só a `main` em `/`.
# `workflow_dispatch` com um branch diferente da `main`: publica a `main` em `/`
# e o branch em `/preview/`, com `VITE_CHANNEL=preview` (armazenamento separado,
# faixa de aviso e manifest próprio). A produção nunca é substituída por algo não validado.
#
# O `preview-on-pr.yml` dispara esse `workflow_dispatch` quando o CI de um PR termina verde,
# com o branch e o `sha` validado. Existe **um preview só**: o último PR com CI verde ganha
# o `/preview/`. O Pages publica um
# artefato só (produção e preview juntos), então toda execução republica a produção.
#
# Todo deploy grava `deploy.json` na raiz do site com o commit da `main` publicado: o que está
# publicado já passou pelo ci.yml inteiro (lint, typecheck, testes, desempenho, build,
# build:mcp, orçamento de tamanho e e2e) quando foi publicado.
# - Sem preview (push na `main`): a `main` precisa passar nos checks, senão nada é publicado.
# - Com preview: o branch precisa passar. Com `sha` cujos check runs `check` e `e2e` (do CI
#   do PR) estão em `success`, ele já passou: o `checks-preview` é pulado e esse SHA é
#   publicado (etapa #375, uma validação por commit). Sem `sha` (disparo manual) ou sem os
#   check runs verdes, o `checks-preview` roda o ci.yml no branch (ou no SHA) como sempre. Os checks da `main` só rodam se ela mudou desde o
#   `deploy.json` publicado; se falharem (instabilidade, por exemplo), a produção é
#   republicada do commit já publicado e o preview sai mesmo assim. Sem `deploy.json`
#   acessível (primeiro deploy), a falha da `main` continua bloqueando.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a publicar em /preview/ (vazio = o escolhido em "Use workflow from")
        required: false
        default: ''
      sha:
        description: Commit do branch a publicar (vazio = a ponta do branch); com check e e2e verdes, não valida de novo
        required: false
        default: ''

# Nível do workflow: só leitura. `pages: write` e `id-token: write` ficam no job `deploy`, o único
# que publica; o `plan` e o `build` rodam código do branch do preview (etapa #971, item 74).
permissions:
  contents: read

# Sem `concurrency` no nível do workflow: ele cancelaria a execução inteira, inclusive um
# `deploy` já em andamento (etapa #971, item 75, decisão 10). O `build` cancela o `build`
# superado (`pages-build`) e o `deploy` tem o grupo `pages` sem cancelar.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.preview.outputs.ref }}
      preview_sha: ${{ steps.preview.outputs.sha }}
      validated: ${{ steps.validated.outputs.validated }}
      main_head: ${{ steps.main.outputs.main_head }}
      published: ${{ steps.main.outputs.published }}
      check_main: ${{ steps.main.outputs.check_main }}
    steps:
      - name: Decide se há preview
        id: preview
        env:
          PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || '' }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          ref="${PREVIEW_REF#refs/heads/}"
          if [ -n "$ref" ] && [ "$ref" != "main" ]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            if [ -n "$SHA" ]; then
              if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
                echo "::error::sha inválido: $SHA (esperado o SHA completo, 40 caracteres hexadecimais)."
                exit 1
              fi
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            fi
          fi

      # O CI do PR já validou este commit? Os check runs `check` e `e2e` são os jobs do
      # ci.yml no evento `pull_request` (os do `checks-preview` se chamam
      # `checks-preview / check`). Os dois em `success`: não valida de novo. Consulta que
      # falha conta como não validado: o checks-preview roda, como num disparo manual.
      - name: Confere se o commit já foi validado
        id: validated
        if: steps.preview.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.preview.outputs.sha }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name')" || passed=""
          validated=true
          for name in check e2e; do
            if ! printf '%s\n' "$passed" | grep -qx "$name"; then
              validated=false
              echo "Check run \`$name\` sem success em \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "- commit do preview \`$SHA\` já validado pelo CI do PR: $validated" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide o que validar na main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.preview.outputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          repo="${GITHUB_REPOSITORY#*/}"
          published="$(curl -fsSL "https://${OWNER}.github.io/${repo}/deploy.json" | jq -r '.main // empty' 2>/dev/null || true)"
          check_main=true
          if [ -n "$PREVIEW" ] && [ -n "$published" ] && [ "$published" = "$main_head" ]; then
            check_main=false
          fi
          {
            echo "main_head=$main_head"
            echo "published=$published"
            echo "check_main=$check_main"
          } >> "$GITHUB_OUTPUT"
          {
            echo "- main atual: \`$main_head\`"
            echo "- main publicada (deploy.json): \`${published:-desconhecida}\`"
            echo "- preview: \`${PREVIEW:-nenhum}\`"
            echo "- checks da main: $check_main"
          } >> "$GITHUB_STEP_SUMMARY"

  checks-main:
    needs: plan
    if: needs.plan.outputs.check_main == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.main_head }}
      label: main

  # Pulado quando o CI do PR já validou o commit (`validated`).
  checks-preview:
    needs: plan
    if: needs.plan.outputs.preview != '' && needs.plan.outputs.validated != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.preview_sha || needs.plan.outputs.preview }}
      label: preview

  build:
    needs: [plan, checks-main, checks-preview]
    # Produção resolvida: checks-main em sucesso ou (há preview e há commit já publicado).
    # O preview é opcional (pulado quando não há), mas, se houver, precisa passar: no
    # checks-preview ou, antes, no CI do PR (pulado por `validated`).
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.checks-main.result == 'success' ||
       (needs.plan.outputs.preview != '' && needs.plan.outputs.published != '')) &&
      (needs.checks-preview.result == 'success' ||
       (needs.checks-preview.result == 'skipped' && needs.plan.outputs.preview == '') ||
       (needs.checks-preview.result == 'skipped' && needs.plan.outputs.validated == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `configure-pages` só lê a configuração do Pages (GET /pages); a escrita é do `deploy`.
      pages: read
    concurrency:
      group: pages-build
      cancel-in-progress: true
    env:
      PREVIEW: ${{ needs.plan.outputs.preview }}
      # O commit validado (o `sha` do disparo) ou, sem ele, a ponta do branch.
      PREVIEW_REF: ${{ needs.plan.outputs.preview_sha || needs.plan.outputs.preview }}
      MAIN_REF: ${{ needs.checks-main.result == 'success' && needs.plan.outputs.main_head || needs.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.MAIN_REF }}
          path: main
      - uses: actions/setup-node@v7
        with:
          # A main tem .nvmrc desde a fase 5.6; o fallback para Node 22 fica para publicar
          # um preview de branch anterior a ela.
          node-version-file: ${{ hashFiles('main/.nvmrc') != '' && 'main/.nvmrc' || '' }}
          node-version: ${{ hashFiles('main/.nvmrc') == '' && '22' || '' }}
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Versão principal
        working-directory: main
        run: |
          npm ci
          npm run build

      - uses: actions/checkout@v7
        if: env.PREVIEW != ''
        with:
          ref: ${{ env.PREVIEW_REF }}
          path: preview

      - name: Preview
        if: env.PREVIEW != ''
        working-directory: preview
        # `VITE_CHANNEL` só no build: os testes (no ci.yml) rodam como a versão principal.
        run: |
          npm ci
          VITE_CHANNEL=preview npm run build

      - name: Monta o site
        run: |
          mkdir site
          cp -R main/dist/. site/
          if [ -d preview/dist ]; then
            mkdir site/preview
            cp -R preview/dist/. site/preview/
          fi
          # Commit da `main` publicado: o plan lê isto no próximo deploy.
          preview_sha=""
          if [ -d preview/dist ]; then preview_sha="$(git -C preview rev-parse HEAD)"; fi
          jq -n \
            --arg main "$(git -C main rev-parse HEAD)" \
            --arg preview "$PREVIEW" \
            --arg previewSha "$preview_sha" \
            '{main: $main, preview: (if $preview == "" then null else $preview end), previewSha: (if $previewSha == "" then null else $previewSha end)}' \
            > site/deploy.json
          cat site/deploy.json

      - name: Avisa se a produção veio do commit já publicado
        # Pulado (main inalterada desde o publicado) não é falha: só avisa quando rodou e não passou.
        if: needs.checks-main.result != 'success' && needs.checks-main.result != 'skipped'
        env:
          MAIN_HEAD: ${{ needs.plan.outputs.main_head }}
          PUBLISHED: ${{ needs.plan.outputs.published }}
        run: |
          msg="Checks da main falharam em $MAIN_HEAD; a produção foi republicada do commit já publicado $PUBLISHED."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # O index.html avulso, para abrir por file:// (o do preview usa os dados do preview).
      - uses: actions/upload-artifact@v7
        with:
          name: index-html
          path: main/dist/index.html
      - uses: actions/upload-artifact@v7
        if: env.PREVIEW != ''
        with:
          name: index-html-preview
          path: preview/dist/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # Sem este `if`, o `success()` implícito exige todos os ancestrais em sucesso, inclusive o
    # `checks-preview` pulado quando não há preview: o deploy era pulado em todo push na main.
    # O gate de qualidade é o do `build`, que já exige checks-main (e checks-preview, se houver).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Um Deploy na fase `deploy` não é cancelado por outro: o seguinte espera (o GitHub
    # recomenda este grupo, sem cancelar, para o Pages).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
