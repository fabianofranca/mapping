name: MCP release

# Stable `mcp-v<version>` (e.g. mcp-v0.3.0): builds `mapping-mcp.js` and attaches it to the Release. The tag's
# version must be the one in `SERVER_VERSION` in `mcp/version.ts`. Only `x.y.z` triggers the stable: the
# pre-releases `mcp-v<version>-rc.<n>` and `mcp-snapshot-pr<N>` (`mcp-prerelease.yml`) never
# trigger it. When publishing, it deletes the rcs (release and tag) of the same version.
#
# Three origins:
# - push to `main` (the merge of an epic or of Dependabot; the ruleset only accepts those): the `decide` job
#   checks whether the `SERVER_VERSION` tag exists. It exists: it finishes green with a notice and `release` is
#   skipped. It does not exist: `release` creates the tag and the Release together (`gh release create --target`),
#   because a tag created by GITHUB_TOKEN does not trigger another workflow (stage #920).
# - push of a hand-created `mcp-v*` tag (plan B): publishes that tag, as before. The Release may
#   have been created earlier through the GitHub UI (which creates the tag along with it): the files are attached to it.
# - `workflow_dispatch`: builds and attaches the files of a tag that already exists (e.g. a Release that
#   was left without them), without deleting or recreating anything.
# No PR data goes into `run:`: only `github.sha`, `github.ref_name` and the outputs of `decide`,
# passed through `env:`.
on:
  push:
    branches: [main]
    # `!mcp-v*-*` leaves the rcs (`mcp-v<version>-rc.<n>`) out: an rc pushed by hand does not
    # trigger the stable nor leave a red run.
    tags: ['mcp-v*', '!mcp-v*-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. mcp-v0.3.2)'
        required: true

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.manual.outputs.tag || steps.main.outputs.tag }}
      sha: ${{ steps.main.outputs.sha }}
      publish: ${{ steps.manual.outputs.publish || steps.main.outputs.publish }}
    steps:
      # Manual tag or `workflow_dispatch`: publishes the event's tag, as before.
      - name: Event tag
        id: manual
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "tag=$TAG"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      # Push to main: does the tag of the commit's version already exist?
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            mcp/version.ts
            scripts/release
      - name: Decide whether to publish
        id: main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHA: ${{ github.sha }}
        run: |
          node scripts/release/stableRelease.mjs decide \
            --version-file mcp/version.ts --sha "$SHA" --output "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two consecutive pushes to main with the same new version do not publish twice: the second
    # waits, finds the tag and only attaches (`--clobber`).
    concurrency:
      group: mcp-release-${{ needs.decide.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^mcp-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag: $TAG (expected mcp-v<version>, e.g. mcp-v0.3.2)." >&2
            exit 1
          fi

      # Push to main: the merge commit (the `sha` of `decide`); in the other cases, the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha || format('refs/tags/{0}', env.TAG) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag version
        run: |
          tag_version="${TAG#mcp-v}"
          code_version="$(node scripts/release/stableRelease.mjs version --version-file mcp/version.ts)"
          if [ "$tag_version" != "$code_version" ]; then
            echo "The tag $TAG does not match SERVER_VERSION ($code_version) in mcp/version.ts." >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      # Without the performance budgets: they fluctuate with the runner and say nothing about the MCP
      # (CI and deploy measure them separately, with `npm run test:perf`).
      - run: PERF_BUDGETS=off npm test
      - run: npm run build:mcp

      - name: Test the generated file outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist-mcp/mapping-mcp.js "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          got="$(node mapping-mcp.js --version)"
          if [ "$got" != "${TAG#mcp-v}" ]; then
            echo "--version printed '$got', expected '${TAG#mcp-v}' (no suffix)." >&2
            exit 1
          fi
          # The signature extractor (`.mjs`, no dependencies) also runs outside the repository.
          cp "$GITHUB_WORKSPACE/dist-mcp/mapping-signature.mjs" .
          node mapping-signature.mjs --help > /dev/null

      - name: Checksum
        working-directory: dist-mcp
        run: |
          sha256sum mapping-mcp.js > mapping-mcp.js.sha256
          sha256sum mapping-signature.mjs > mapping-signature.mjs.sha256

      # The published files stay together in `release-assets/`: the server, the signature extractor, the `.sha256` files and the
      # workspace ones (the workspace files script runs once).
      - name: Release files
        run: |
          mkdir release-assets
          cp dist-mcp/mapping-mcp.js dist-mcp/mapping-mcp.js.sha256 release-assets/
          cp dist-mcp/mapping-signature.mjs dist-mcp/mapping-signature.mjs.sha256 release-assets/
          node scripts/release/workspaceAssets.mjs release-assets > /dev/null

      - name: Publish to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release-assets/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Created through the GitHub UI, in a previous run or by another run that
            # published the same tag midway: only attach the files (decision 3 of #920).
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG"
          else
            gh release create "$TAG" \
              "${assets[@]}" \
              --title "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --notes "Mapping MCP server. Copy \`mapping-mcp.js\` to \`tools/\` in your repository and register it in \`.mcp.json\`. It also brings the workspace's \`setup.sh\`, the \`SKILL.md\` skill, the \`AGENTS.mapping.md\` rules and the \`watch-comments.mjs\` watcher, the \`watch-conversations.SKILL.md\` skill that wakes the agent in the same chat, and the \`mapping-signature.mjs\` signature extractor, each with its \`.sha256\`. Instructions in docs/MCP.md. To update a workspace that still has the old \`setup.sh\`, once: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/setup.sh -o setup.sh && chmod +x setup.sh && ./setup.sh\`."
          fi

      - name: Delete this version's release candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#mcp-v}"
          # rc releases (with the tag) and rc tags left without a release.
          for rc in $(gh release list --limit 200 --json tagName --jq ".[].tagName" |
            grep -E '^mcp-v[0-9.]+-rc\.[0-9]+$' | grep -F "mcp-v${version}-rc." || true); do
            gh release delete "$rc" --cleanup-tag --yes
          done
          for rc in $(git ls-remote --tags origin "refs/tags/mcp-v${version}-rc.*" |
            sed -n "s#.*refs/tags/\(.*\)\$#\1#p"); do
            git push origin --delete "refs/tags/$rc" || true
          done
