name: Set up Node and dependencies
description: >-
  Node (version from .nvmrc; Node 22 on refs older than phase 5.6, which do not have it), node_modules
  cache and `npm ci` only on a cache miss. Requires the checkout to be done first. No `cache: npm` from
  setup-node: the node_modules cache already skips `npm ci` in most runs.

outputs:
  node-version:
    description: Installed Node version
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      id: node
      with:
        node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
        node-version: ${{ hashFiles('.nvmrc') == '' && '22' || '' }}
    # node_modules cache (OS, Node and package-lock.json); `npm ci` only on a miss.
    - uses: actions/cache@v5
      id: modules
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
